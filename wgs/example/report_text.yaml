  lede:
  - 这份图鉴建立在<b>整个基因组</b>上：{depth}× 平均深度，{pass} 个通过质控的变异。它回答的问题从祖源与父母系，到需要知道的变异、用药基因、基因缺失和重复序列长度。
  - 'This atlas rests on the <b>whole genome</b>: {depth}× mean depth, {pass} variants passing quality control. It runs from ancestry and parental lines to the variants worth knowing, drug genes, deleted genes and repeat lengths.'
  tier_h:
  - 先看结论：哪些可信，哪些只是参考
  - 'The short version: what is solid and what is only a hint'
  tier1:
  - 很可靠
  - SOLID
  tier2:
  - 比较可靠
  - FAIRLY SOLID
  tier3:
