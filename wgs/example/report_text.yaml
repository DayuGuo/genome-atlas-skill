  c_hla:
  - HLA 分型（T1K，二位分辨率）
  - HLA types (T1K, two-field)
  n_hla:
  - 蓝色 = 有用药警示的等位基因。A*02:07、B*54:01、DRB1*04:05、DQB1*04:01 都是东亚常见型；DRB1*04:05 和 A*24:02 在东亚人群中与 1 型糖尿病、类风湿关节炎的风险相关，属于人群统计。短读长 WGS 的 HLA 分型准确度高但不是临床级。
  - Blue = allele with a prescribing alert. A*02:07, B*54:01, DRB1*04:05 and DQB1*04:01 are all common in East Asia; DRB1*04:05 and A*24:02 associate with type 1 diabetes and rheumatoid arthritis risk in East Asian cohorts, at population level. HLA typing from short-read WGS is accurate but not clinical grade.
  c_hlad:
  - 这套 HLA 分型对应哪些疾病与药物关联
  - What these HLA types mean for disease and drug risk
  sub_hlad:
  - 逐条核对已知的 HLA 关联 · 阴性结论与阳性结论同样有用
  - checked allele by allele against established HLA associations · the negatives matter as much as the positives
  th_cond:
