  th_cclaim:
  - 流行说法
  - the popular claim
  th_cevi:
  - 证据实际支持什么
  - what the evidence supports
  n_cand:
  - 把这些位点列出来，是为了说明它们<b>不能</b>用来推断性格。候选基因时代的做法是先猜一个基因，再在几百人里找关联，这种设计几乎必然产生假阳性；当样本量涨到几十万时，COMT、BDNF、DRD2 这些位点对人格量表的效应基本归零。真正稳健的规律是另一类：单个常见位点对复杂行为的效应极小，需要成千上万个位点相加才能解释几个百分点的差异。这个表里唯一例外是 ALDH2 与 ADH1B，它们对饮酒行为的效应确实很大，因为作用机制是直接的代谢反应而不是心理特质。5-HTTLPR 与 MAOA 的 uVNTR 是重复序列而非单碱基变异，150 bp 的短读长无法可靠定型，此处不作判读。
  - 'These are listed to show why they <b>cannot</b> be used to read personality. The candidate-gene approach picked a gene by intuition and looked for an association in a few hundred people, a design almost guaranteed to produce false positives; once sample sizes reached the hundreds of thousands, the effects of COMT, BDNF and DRD2 on personality scales fell essentially to zero. The robust regularity is the opposite one: any single common variant moves complex behaviour very little, and it takes thousands of variants added together to explain a few percent of the variation. The one exception in this table is ALDH2 and ADH1B, whose effects on drinking are genuinely large because the mechanism is a direct metabolic reaction rather than a psychological trait. The famous 5-HTTLPR and MAOA uVNTR are repeat polymorphisms rather than single-base changes and cannot be typed reliably from 150 bp reads, so no call is made here.'
  c_prs:
  - 多基因评分：把几十万个小效应位点加在一起，看你在 504 个东亚人里排第几
  - 'Polygenic scores: hundreds of thousands of tiny effects added up, then ranked among 504 East Asians'
  lg_wgs:
  - 东亚 504 人中的百分位
  - percentile among 504 East Asians
  lg_han:
  - 汉族 208 人中
  - among 208 Han
  sub_prs:
  - 31 个评分 · PGS Catalog 东亚人群模型 · 位点直接测出，覆盖 96–100% · 右侧数字 = 百分位 / 位点覆盖率
  - '31 scores · PGS Catalog East Asian models · sites typed directly, 96–100% covered · right: percentile / site coverage'
  n_prs:
  - 评分位点直接测出，参考人群是 1000 Genomes 的 504 名东亚人（空心圆为其中 208 名汉族）。排在高位的是阿尔茨海默病（98，APOE ε4 贡献大）、收缩压/高血压（97/95）、甘油三酯和胆红素（93，后者与 UGT1A1 *28 一致）、痛风（89）；排在低位的是 HDL 胆固醇（4）、青光眼（7）、胃癌（9）。这些是人群统计：说明的是相对位置，不预测个人是否发病，也不能替代体检指标。
  - 'Score sites are typed directly; the reference is the 504 East Asians of 1000 Genomes (hollow circle: the 208 Han among them). High: Alzheimer''s (98, driven largely by APOE ε4), systolic pressure / hypertension (97/95), triglycerides and bilirubin (93; the latter matches UGT1A1 *28), gout (89). Low: HDL cholesterol (4), glaucoma (7), stomach cancer (9). These are population statistics: relative positions, not a prediction of illness, and no substitute for measured values.'
  c_cnv:
  - 基因缺失：{sv} 个结构变异里值得看的几个
  - 'Gene deletions: the few that matter among {sv} structural variants'
  sub_cnv:
  - 读段深度 / 全基因组平均 · 0 = 两份都缺失 · 0.5 = 缺一份 · 1 = 正常
  - read depth / genome average · 0 = both copies missing · 0.5 = one missing · 1 = normal
  n_cnv:
  - GSTM1 与 LCE3B/C 两份都缺失，在东亚约一半人如此（GSTM1 null 与某些致癌物解毒有关；LCE3B/C 缺失是银屑病的常见风险等位基因）。GSTT1、UGT2B17 各缺一份。CFHR3-CFHR1 缺一份，是老年黄斑变性的保护性等位基因。HBA 两份齐全：没有 α 地中海贫血缺失。RHD 两份：RhD 阳性。
  - 'GSTM1 and LCE3B/C are missing on both chromosomes, as in about half of East Asians (GSTM1 null relates to detoxifying some carcinogens; the LCE3B/C deletion is a common psoriasis risk allele). GSTT1 and UGT2B17 each lack one copy. CFHR3-CFHR1 lacks one copy, a protective allele for macular degeneration. Both HBA copies present: no α-thalassaemia deletion. Two RHD copies: RhD positive.'
  c_str:
  - 重复序列扩增病：38 个位点全部正常
  - 'Repeat-expansion diseases: all 38 loci normal'
  sub_str:
  - 最长等位基因相对致病阈值 · 亨廷顿舞蹈症、脆性 X、脊髓小脑共济失调、肌强直性营养不良、C9orf72 等
  - longest allele relative to the pathogenic threshold · Huntington's, fragile X, spinocerebellar ataxias, myotonic dystrophy, C9orf72 and others
  n_str:
  - HTT 17/17、FMR1 27、ATXN3 11/23、TBP 34/35（正常 ≤40）、ATXN2 22/22。重复长度由跨越读段与配对读段联合估计，接近阈值时才需要毛细管电泳复核。
  - HTT 17/17, FMR1 27, ATXN3 11/23, TBP 34/35 (normal ≤40), ATXN2 22/22. Repeat lengths are estimated from spanning and paired reads; capillary electrophoresis is only needed when a result approaches the threshold.
  c_roh:
  - 近亲检查：{rohn} 段 ≥1 Mb 的纯合区，合计 {rohmb} Mb，最长 {rohmax} Mb，没有父母近亲的迹象
  - 'Relatedness: {rohn} homozygous runs ≥1 Mb, {rohmb} Mb in total, longest {rohmax} Mb; no sign of parental relatedness'
  sub_roh:
  - 22 条常染色体 · 补全基因型集 + 1000G 东亚频率 · bcftools roh
  - 22 autosomes · complete genotype set + 1000G East Asian frequencies · bcftools roh
  n_roh:
  - 最长的一段在 3p21，是已知的低重组热点，不是近亲信号。父母为表亲时通常会出现多段 >10 Mb 的纯合区。
  - The longest run sits at 3p21, a known low-recombination hotspot rather than a relatedness signal. First-cousin parents typically leave several runs longer than 10 Mb.
  c_misc:
  - 其它
  - The rest
  c_meth:
  - 用了什么数据和工具，哪些地方要小心
  - Data, tools, and where to be careful
  meth:
  - <b>数据</b> WeGene 全基因组测序交付件：CRAM 27 GB、VCF、Y BAM，MD5 核对通过；MGI T7 双 lane，Sentieon bwa + DNAscope，GRCh37。<b>流程</b> samtools/bcftools 1.22、mosdepth（可调用区）、bcftools norm（左对齐、拆分多等位）、plink2（1000G PCA 投影、PRS）、bcftools csq + Ensembl 87 GFF3（功能注释）、ClinVar {cvd}、gnomAD v2.1.1（频率）、Delly 1.7（结构变异）+ 1 kb 窗口深度重定基因型、ExpansionHunter 5（STR）、SMNCopyNumberCaller、PharmCAT 3.4 + Picard LiftoverVcf、Cyrius 1.1、T1K 1.0 + IPD-IMGT/HLA、haplogrep3 3.2、YFull 14.05 树 + ybrowse 位点表。<b>关键约定</b> VCF 只含变异位点，所有与参考人群的比较都先用可调用掩膜（MAPQ≥20、深度≥8）把参考纯合显式填好；X 染色体（含 PAR）与线粒体从 CRAM 重新调用。脚本在 scripts/wgs/，全部输出在 wgs/。
  - '<b>Data</b> WeGene whole-genome delivery: 27 GB CRAM, VCF, Y BAM, MD5 verified; MGI T7 two lanes, Sentieon bwa + DNAscope, GRCh37. <b>Pipeline</b> samtools/bcftools 1.22, mosdepth (callable regions), bcftools norm (left-aligned, split multiallelics), plink2 (1000G PCA projection, PRS), bcftools csq + Ensembl 87 GFF3 (consequences), ClinVar {cvd}, gnomAD v2.1.1 (frequencies), Delly 1.7 (structural variants) re-genotyped by 1 kb depth windows, ExpansionHunter 5 (STRs), SMNCopyNumberCaller, PharmCAT 3.4 + Picard LiftoverVcf, Cyrius 1.1, T1K 1.0 + IPD-IMGT/HLA, haplogrep3 3.2, YFull 14.05 tree + ybrowse SNP index. <b>Key convention</b> the VCF lists variant sites only, so every comparison with a reference panel first writes homozygous reference explicitly inside the callable mask (MAPQ≥20, depth≥8); the X (PAR included) and the mitochondrion were re-called from the CRAM. Scripts in scripts/wgs/, all outputs in wgs/.'
  limits:
  - <b>局限</b> 单样本 30× 短读长：HLA、CYP2D6 复杂重排、SMN 的结果准确但不是临床级；Y 平均深度低但支系定义位点处 9–26×。PharmCAT 有 94 个位点因跨版本插入缺失无法转换而缺失，主要在 RYR1、G6PD、CYP2D6。功能丧失变异的频率过滤依赖 gnomAD v2.1.1 与 1000G，后者对插入缺失覆盖差。多基因评分参考人群只有 504 人。
  - '<b>Limits</b> single-sample 30× short reads: HLA, complex CYP2D6 rearrangements and SMN results are accurate but not clinical grade; the Y is shallow on average yet 9–26× at branch-defining sites. PharmCAT lacks 94 positions whose indels do not lift over between builds, mostly in RYR1, G6PD and CYP2D6. Frequency filtering of loss-of-function variants relies on gnomAD v2.1.1 and 1000G, and the latter covers indels poorly. The polygenic reference population is only 504 people.'
  disc:
  - 本页来自消费级全基因组测序和公开数据库，用于个人了解和学习，不是医学诊断，也不是用药建议。CFTR、ATP7B、HLA-B*13:01 三项若要用于任何医疗决定，须在有资质的实验室复核。凡涉及用药或疾病的内容，行动前请找医生。
  - This page comes from consumer whole-genome sequencing and public databases, for personal interest and learning; it is neither a diagnosis nor medication advice. The CFTR, ATP7B and HLA-B*13:01 findings must be confirmed in an accredited laboratory before any medical decision. Talk to a doctor before acting on anything about medicines or disease.
