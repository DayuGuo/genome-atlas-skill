  - note
  n_hlad:
  - <b>几个有分量的阴性结论。</b>乳糜泻患者中超过 99% 携带 DQ2 或 DQ8，两者皆无基本可以排除这个诊断方向。发作性睡病 1 型患者几乎全部携带 DQB1*06:02，未携带同样是很强的阴性。强直性脊柱炎的 B*27、白塞病的 B*51 也都不携带。<b>阳性的几条要谨慎读。</b>DRB1*04:05 与 DQB1*04:01 是东亚人群 1 型糖尿病与类风湿关节炎的风险单倍型，报道的比值比在 3 到 6 之间，这是人群水平的风险提升，绝大多数携带者一生不发病。药物方面只有 B*13:01 需要行动，用氨苯砜前应做临床级筛查。
  - '<b>Several negatives carry weight.</b> More than 99% of coeliac patients carry DQ2 or DQ8; having neither largely rules that direction out. Nearly every type 1 narcolepsy patient carries DQB1*06:02, so its absence is a strong negative too, as is the absence of B*27 for ankylosing spondylitis and B*51 for Behçet disease. <b>The positives need care.</b> DRB1*04:05 with DQB1*04:01 is the East Asian risk haplotype for type 1 diabetes and rheumatoid arthritis, with reported odds ratios between 3 and 6; that is a population-level shift and the great majority of carriers never develop either disease. On the drug side only B*13:01 calls for action: screen before dapsone.'
  c_afam:
  - 这些片段落在哪些基因上
  - Which genes those segments landed on
  sub_afam:
  - 把 191 段渗入片段与 19,430 个蛋白编码基因取交集，再按基因家族归类
  - intersecting the 191 introgressed segments with 19,430 protein-coding genes and grouping by family
  src_afam:
  - 条长 = 该家族落在片段内的基因比例 · 右侧 = 片段内基因数 / 家族总基因数
  - bar = share of that family inside a segment · right = genes inside / genes in the family
  n_afam:
  - 片段总共覆盖 752 个基因，与随机打乱片段位置的期望（751 个）几乎一样，所以<b>不是基因多</b>，而是<b>落在哪些基因上</b>值得看。I 型干扰素基因簇的 10 个基因<b>全部</b>在片段内，HLA 二类区 19 个基因中有 13 个，TLR1/6/10 三个模式识别受体、表皮分化复合体的 15 个基因也在其中。免疫、皮肤屏障、嗅觉，正是文献里反复报道的古老人类渗入热点。一种解释是这些片段带来的等位基因在早期现代人迁出非洲后适应新环境时有用，因而被保留下来；另一种解释是这些区域本身重组率低、片段更易整段留存。两者可能都对。
  - The segments cover 752 genes against 751 expected when their positions are shuffled at random, so the point is <b>not that they carry many genes</b> but <b>which genes they carry</b>. All ten type I interferon genes sit inside a segment, as do 13 of the 19 HLA class II genes, the pattern-recognition receptors TLR1, TLR6 and TLR10, and fifteen genes of the epidermal differentiation complex. Immunity, skin barrier and olfaction are exactly the introgression hotspots reported again and again in the literature. One reading is that these alleles were useful as early modern humans met new pathogens and climates outside Africa and were therefore retained; another is that these regions simply recombine less, so segments survive intact. Both are probably true.
  c_beh:
  - 行为与精神类评分，以及它们能说明什么
  - Behavioural and psychiatric scores, and what they can actually say
  sub_beh:
  - 11 个在东亚人群中训练的评分与 5 个在欧洲人群中训练的评分放在一起 · 参考人群同为 504 名东亚人
  - 11 scores trained in East Asians alongside 5 trained in Europeans · the same 504 East Asian reference in both cases
  lg_eas2:
  - 东亚人群训练
  - trained in East Asians
  lg_eur2:
  - 欧洲人群训练（仅作对照）
  - trained in Europeans (for contrast only)
  src_beh:
  - 右侧数字 = 百分位 / 评分位点的覆盖率
  - 'right: percentile / share of the score''s variants covered'
  n_beh:
  - 东亚训练的评分里，认知相关的两项最高（轻度认知障碍 97、老年性痴呆 97），与前面阿尔茨海默病评分的 98 一致，主要由 APOE ε4 驱动，三者本质上在说同一件事。广泛性焦虑 84 偏高。酒精相关的两项都很低（酒精依赖 6.5，酒精相关障碍 10），戒烟成功 4.6 偏低但样本解释力有限。
  - Among the East Asian scores the two cognitive ones sit highest (mild cognitive impairment 97, senile dementia 97), matching the Alzheimer's score of 98 seen earlier; all three are driven largely by APOE ε4 and are essentially restating one fact. Generalised anxiety at 84 is on the high side. Both alcohol scores sit low (alcoholism 6.5, alcohol-related disorders 10).
  cal_beh:
  - <b>为什么欧洲训练的评分不能直接用。</b>看酒精这一对：东亚训练的“酒精依赖”把大宇放在第 6.5 百分位，欧洲训练的“饮酒量”却放在第 91 百分位，方向完全相反。原因很具体——东亚评分里权重最大的四个位点全部落在 ALDH2 基因区（占总权重 2%），也就是那个让人喝酒脸红的基因；欧洲评分在 ALDH2 区<b>一个位点都没有</b>，因为 rs671 在欧洲人群中几乎不存在，GWAS 根本发现不了它。同一个人、同一份基因组，换一个训练人群，结论就翻过来了。这不是评分算错了，而是它们本来就只在训练人群里有效。
  - '<b>Why the European-trained scores cannot simply be reused.</b> Look at the alcohol pair: the East-Asian-trained alcoholism score puts {NAME_EN} at the 6.5th percentile while the European-trained drinking score puts him at the 91st, pointing in opposite directions. The reason is concrete. The four largest weights in the East Asian score all fall in the ALDH2 region, the gene behind the alcohol flush, and that region carries 2% of the score''s total weight. The European score has <b>no variant at all</b> in the ALDH2 region, because rs671 is essentially absent in Europeans and no European study could ever find it. Same person, same genome, and swapping the training population flips the answer. The scores are not miscalculated; they were only ever valid inside the population that produced them.'
  c_cand:
  - 经典的“性格基因”
  - The classic personality genes
  sub_cand:
  - 这些位点在二十年前的候选基因研究中出名，全基因组时代大多没能重复
  - these variants became famous in candidate-gene studies twenty years ago; most did not survive the genome-wide era
