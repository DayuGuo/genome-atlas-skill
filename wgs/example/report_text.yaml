  c_arch:
  - 身上还留着尼安德特人的片段
  - Neanderthal segments still in the genome
  sub_arch:
  - 以 Browning 等 2018 年在北京汉与南方汉中检出的 2,194 个渗入片段为查询集 · 加高 = 两条染色体都带
  - the 2,194 introgressed segments Browning and colleagues detected in Beijing and southern Han serve as the query set · taller = present on both chromosomes
  src_arch:
  - 绿色 = 尼安德特 · 浅蓝 = 丹尼索瓦 · 右侧数字 = 该染色体的片段数
  - green = Neanderthal · light blue = Denisovan · the number on the right is that chromosome's segment count
  n_arch:
  - 尼安德特片段 {neamb} Mb，丹尼索瓦只有 {denmb} Mb，这个比例是东亚大陆人群的典型模式，丹尼索瓦成分要到大洋洲人群才显著上升。{archn} 段中只有 13 段纯合，即父母双方在同一位置传下了同一段古老序列。最长的一段在 4 号染色体 125.7–132.6 Mb。这里统计的是片段跨度而非古老等位基因比例，所以数字大于通常引用的“东亚人约 2%”。
  - Neanderthal segments account for {neamb} Mb against only {denmb} Mb of Denisovan, the usual pattern for mainland East Asia; the Denisovan share rises substantially only in Oceanian populations. Of the {archn} segments just 13 are homozygous, meaning both parents passed on the same archaic stretch at the same place. The longest sits on chromosome 4 at 125.7-132.6 Mb. What is counted here is segment span rather than the fraction of archaic alleles, so the figure runs larger than the roughly 2% usually quoted for East Asians.
  c_phase:
  - 把父母给的两条染色体分开，回答两个具体问题
  - Separating the two parental chromosomes, and two questions it answers
  sub_phase:
  - 同一条读段若同时盖住两个杂合位点，就能确定它们是否在同一条染色体上 · WhatsHap 2.8 直接读 CRAM
  - when one read spans two heterozygous sites it settles whether they sit on the same chromosome · WhatsHap 2.8 reading the CRAM directly
  n_phase:
  - <b>UGT1A1</b> 的 *80 与 *28 落在同一个相位块内且方向一致，说明它们在<b>同一条</b>染色体上，另一条是正常的 *1——这正是 Gilbert 型胆红素代谢的标准构型，与总胆红素评分第 93 百分位一致。<b>FUT3</b>（Lewis 血型）的两个失活变异同样同链，因此另一条染色体的 FUT3 完整，血型为 Le(a−b+) 而不是 Lewis 阴性。读段相位化只能跨越读段能覆盖的距离，要跨过整条染色体需要借助人群参考做统计相位，上面的祖源涂色就建立在统计相位之上。
  - The <b>UGT1A1</b> variants *80 and *28 fall inside one phase block with the same orientation, so they sit on the <b>same</b> chromosome and the other carries a normal *1. That is the standard configuration behind Gilbert-type bilirubin handling, and it matches the 93rd-percentile bilirubin score. The two inactivating <b>FUT3</b> variants behind the Lewis blood group are likewise on one chromosome, leaving the other FUT3 copy intact, so the type is Le(a-b+) rather than Lewis-negative. Read-backed phasing reaches only as far as reads can span; crossing a whole chromosome needs statistical phasing against a population reference, which is what the ancestry painting above is built on.
  c_spec:
  - '{snvn} 个替换的形状'
  - The shape of {snvn} substitutions
  sub_spec:
  - 每个单碱基替换按“替换类型 + 前后各一个碱基”分成 96 类 · 这是生殖系突变过程的指纹，也是检查测序偏差的镜子
  - every single-base substitution sorted into 96 classes by type and flanking bases · a fingerprint of the germline mutation process and a mirror for sequencing bias
  n_spec:
  - C>T 与 T>C 合计约三分之二，最高的几根柱子全部落在 CpG 位点的 C>T 上（合计 {cpg}%）。这来自甲基化胞嘧啶的自发脱氨，是人类生殖系突变最稳定的特征。谱型平滑、没有单一类别异常突出，说明这批数据没有明显的建库或测序偏差；若存在氧化损伤（C>A 升高）或脱氨伪影，会在这张图上立刻显形。
  - C>T and T>C together make up about two thirds, and the tallest bars all fall on C>T at CpG sites, {cpg}% in total, from spontaneous deamination of methylated cytosine, the most stable feature of human germline mutation. The spectrum is smooth with no single class standing out, so the data carry no obvious library or sequencing bias; oxidative damage, which shows up as excess C>A, or deamination artefacts would be visible here immediately.
