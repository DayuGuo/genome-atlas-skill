findings:
- gene: CFTR
  gt_zh: TG12-5T / TG12-5T
  gt_en: TG12-5T / TG12-5T
  tag_zh: 纯合 · 2 星
  tag_en: homozygous · 2-star
  hot: true
  zh: ClinVar 把它记作 c.1210-11T>G（致病/可能致病，多家实验室一致）。读段显示这其实就是著名的 <b>5T 等位基因</b>并带 TG12 背景：19 条跨越该区的读段里 16 条是 TG12-T5，没有一条是参考的 TG11-T7。5T 是一种<b>外显率不完全的轻型 CFTR 变异</b>，纯合者与先天性双侧输精管缺如（男性不育的一种）、特发性胰腺炎、支气管扩张相关，但多数纯合者一生无症状。gnomAD 东亚等位基因频率约 2–3%。
  en: 'ClinVar records it as c.1210-11T>G (pathogenic / likely pathogenic, several labs agree). The reads show it is the well-known <b>5T allele</b> on a TG12 background: 16 of 19 reads crossing the site carry TG12-T5, none carry the reference TG11-T7. 5T is a <b>mild CFTR variant with incomplete penetrance</b>; homozygotes have raised rates of congenital absence of the vas deferens (a cause of male infertility), idiopathic pancreatitis and bronchiectasis, yet most stay symptom-free. gnomAD East Asian allele frequency about 2–3%.'
  act_zh: 如有生育计划：先做精液分析；配偶做 CFTR 携带者筛查。反复胰腺炎或慢性鼻窦/肺部症状时告知医生。临床使用前需临床级复核。
  act_en: 'If planning children: a semen analysis first, and CFTR carrier screening for a partner. Mention it if recurrent pancreatitis or chronic sinus/lung symptoms arise. Confirm in a clinical lab before acting.'
- gene: ATP7B
  gt_zh: p.Asn1270Ser 杂合
  gt_en: p.Asn1270Ser heterozygous
  tag_zh: 携带者
  tag_en: carrier
  hot: true
  zh: 威尔逊病（铜代谢障碍，常染色体隐性）的已知致病变异，ClinVar 24 家实验室判为致病。<b>只有一份</b>，本人不发病；这个基因里没有第二个致病变异。gnomAD 东亚频率 0.02%。
  en: An established Wilson disease (copper storage disorder, autosomal recessive) mutation; 24 ClinVar labs call it pathogenic. <b>One copy only</b>, so a carrier, not affected; no second pathogenic variant in the gene. gnomAD East Asian frequency 0.02%.
  act_zh: 生育前配偶可做 ATP7B 携带者筛查；若双方都是携带者，子女有 1/4 风险。
  act_en: A partner can be screened for ATP7B before having children; if both are carriers each child has a 1-in-4 risk.
- gene: CYP2A6
  gt_zh: '*4 / *4 · 全基因缺失'
  gt_en: '*4 / *4 · whole-gene deletion'
  tag_zh: 拷贝数 0
  tag_en: zero copies
  hot: false
  zh: 基因所在的 32 kb 区域没有任何读段，两侧深度正常：两份 CYP2A6 都缺失。这是尼古丁的主要代谢酶，缺失者尼古丁清除极慢；也影响替加氟、来曲唑等药物。东亚 *4 等位基因频率约 15–20%，纯合并不罕见。
  en: 'No reads at all across the 32 kb gene while both flanks are at normal depth: both copies of CYP2A6 are gone. It is the main nicotine-clearing enzyme, so nicotine is cleared very slowly; tegafur and letrozole are also affected. The *4 allele runs at about 15–20% in East Asians, so homozygotes are not rare.'
  act_zh: ''
  act_en: ''
- gene: HLA-B
  gt_zh: B*13:01 / B*54:01
  gt_en: B*13:01 / B*54:01
  tag_zh: 用药警示
  tag_en: drug alert
  hot: false
  zh: <b>HLA-B*13:01</b> 与氨苯砜超敏综合征强相关（中国人群比值比约 20），用氨苯砜（麻风、疱疹样皮炎、某些皮肤病）前应做此筛查。没有 B*58:01（别嘌醇）、B*15:02 / A*31:01（卡马西平）、B*57:01（阿巴卡韦），5 个风险等位基因的标签 SNP 也全为参考型。
  en: <b>HLA-B*13:01</b> is strongly linked to dapsone hypersensitivity syndrome (odds ratio around 20 in Chinese cohorts); screening is advised before dapsone (leprosy, dermatitis herpetiformis, some skin conditions). No B*58:01 (allopurinol), B*15:02 / A*31:01 (carbamazepine) or B*57:01 (abacavir); the tag SNPs of all five risk alleles are reference as well.
  act_zh: 临床使用前以临床级 HLA 分型确认。
  act_en: Confirm with clinical-grade HLA typing before use.
- gene: MAPT
  gt_zh: p.Arg5His 杂合
  gt_en: p.Arg5His heterozygous
  tag_zh: 意义未明
  tag_en: uncertain
  hot: false
  zh: 额颞叶痴呆文献报道过一次，ClinVar 分类冲突（致病 1 / 可能致病 1 / 未明 1），gnomAD 东亚频率 0.08%。按意义未明处理，不据此推断风险。
  en: Reported once in frontotemporal dementia literature; ClinVar classifications conflict (1 pathogenic / 1 likely / 1 uncertain), gnomAD East Asian frequency 0.08%. Treated as a variant of uncertain significance; no risk inferred.
  act_zh: ''
  act_en: ''
- gene: UGT1A1
  gt_zh: '*1 / *80+*28'
  gt_en: '*1 / *80+*28'
  tag_zh: Gilbert 易感
  tag_en: Gilbert-prone
  hot: false
  zh: 启动子 TA7（*28）与 *80 同在一条链上，是 Gilbert 综合征（轻度间歇性胆红素升高，无害）的常见基础。多基因评分里总胆红素也在第 93 百分位，两者一致。伊立替康、阿扎那韦用药时相关。
  en: Promoter TA7 (*28) together with *80 on one chromosome, the common basis of Gilbert syndrome (mild intermittent bilirubin rises, harmless). The bilirubin polygenic score sits at the 93rd percentile, consistent with this. Relevant for irinotecan and atazanavir.
  act_zh: ''
  act_en: ''
