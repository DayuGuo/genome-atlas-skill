  sub_som:
  - 测序用的是血液，所以这份数据也记录了白细胞自己积累的变化
  - the sequencing was done on blood, so the data also record what these white blood cells have accumulated on their own
  n_som:
  - 克隆性造血指某个造血干细胞获得驱动突变后扩增出一群后代细胞，随年龄增长越来越常见，40 岁以下不到 2%。这里检查了 DNMT3A、JAK2、TP53 等 19 个最常见热点，没有任何一条支持读段；20 个相关基因内也没有变异等位基因比例在 5–35% 之间的编码变异。30× 深度的检出下限约为 10%，更小的克隆本来就看不到。端粒长度无法估计：6.52 亿条读段里只有 {telk7} 条带 7 个以上端粒重复，836 万条未比对读段中只有 3 条，说明交付流程把端粒重复读段滤掉了。
  - 'Clonal haematopoiesis is what happens when one blood stem cell acquires a driver mutation and expands into a family of descendants; it becomes common with age and affects under 2% of people below forty. Nineteen of the commonest hotspots across DNMT3A, JAK2, TP53 and others were checked and not one supporting read appeared, nor did any coding variant with a variant allele fraction between 5% and 35% turn up in the twenty associated genes. At 30x the detection limit is roughly 10%, so smaller clones would be invisible in any case. Telomere length cannot be estimated: only {telk7} of 652 million reads carry seven or more telomeric repeats and only 3 of 8.36 million unmapped reads do, so the delivery pipeline stripped telomeric repeat reads.'
  c_pgx:
  - 用药相关基因：从整段基因读出星号等位基因，包括拷贝数
  - 'Medicines: star alleles read from whole genes, copy number included'
  n_pgx:
  - 双倍型由 PharmCAT 3.4（先把 GRCh37 上的参考纯合显式填好再转换到 GRCh38，否则 CYP3A5 会被误报成 *1/*1）、Cyrius（CYP2D6 含拷贝数）、Delly + 深度（CYP2A6 缺失）和 T1K（HLA）给出完整双倍型。
  - Diplotypes are called with PharmCAT 3.4 (homozygous-reference sites filled explicitly on GRCh37 before lift-over to GRCh38; without that step CYP3A5 comes out as *1/*1), Cyrius (CYP2D6 with copy number), Delly plus depth (the CYP2A6 deletion) and T1K (HLA).
