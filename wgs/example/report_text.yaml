  - HINTS ONLY
  tier1_b:
  - 测序质量好（{depth}×，Ti/Tv {titv}）。男性，汉族，偏北。父系 O-Y25189，母系 D4h1c。CFTR 5T 纯合、ATP7B 携带者、CYP2A6 全缺失、HLA-B*13:01：四条直接读段可见的结论。ALDH2 脸红型、APOE ε3/ε4、NUDT15 中间代谢、CYP3A5 非表达者。血型 A 型 RhD 阳性。38 个重复序列疾病位点全部正常。SMN1 两份。
  - 'Good sequencing ({depth}×, Ti/Tv {titv}). Male, Han Chinese, northern-leaning. Paternal line O-Y25189, maternal D4h1c. CFTR 5T homozygous, ATP7B carrier, CYP2A6 fully deleted, HLA-B*13:01: four findings visible directly in the reads. ALDH2 flush type, APOE ε3/ε4, NUDT15 intermediate, CYP3A5 non-expresser. Blood group A, RhD positive. All 38 repeat-expansion loci normal. Two copies of SMN1.'
  tier2_b:
  - HLA 其余位点的二位分辨率分型。GSTM1、LCE3B/C 纯合缺失，GSTT1、UGT2B17、CFHR3-1 杂合缺失。无 α 地贫缺失。没有父母近亲的迹象。
  - Two-field HLA types at the other loci. GSTM1 and LCE3B/C homozygously deleted; GSTT1, UGT2B17, CFHR3-1 one copy. No α-thalassaemia deletion. No sign of parental relatedness.
  tier3_b:
  - 多基因风险评分（现在覆盖 96–100% 的位点，但仍是人群统计）；MAPT 等意义未明变异；罕见杂合功能丧失变异；祖源在汉族内部的精细位置。
  - Polygenic scores (now covering 96–100% of their sites, still population statistics); variants of uncertain significance such as MAPT; rare heterozygous loss-of-function variants; fine position within the Han spectrum.
