  - 504 East Asians · {ne} sites · CHB Beijing Han · CHS southern Han · CDX Dai · JPT Japanese · KHV Kinh
  src_pg:
  - 最近的人群质心（PC1–4 距离）{nearg}，几乎并列 · 最近的 15 个人：{knng}
  - 'nearest group centroids (PC1–4 distance) {nearg}, a near tie · 15 nearest people: {knng}'
  src_pe:
  - 最近的人群 {near} · 最近的 15 个人：{knn}
  - 'nearest group {near} · 15 nearest people: {knn}'
  n_pca:
  - 用的是完整的基因型集：在 1000 Genomes 的 8,094 万个位点上，没测到变异且深度足够的位点显式记为参考纯合，再做 LD 修剪后投影。“偏北”只是在北京汉与南方汉两个样本群之间的相对位置，不是籍贯。
  - 'Built from the complete genotype set: at all 80.9 million 1000 Genomes sites, positions with no variant and adequate depth are written explicitly as homozygous reference, then LD-pruned and projected. ''Northern-leaning'' is only a position between the Beijing and southern Han samples, not a place of origin.'
  c_find:
  - 全基因组里值得知道的变异：一条纯合、一个携带者、一处缺失、一个 HLA
  - 'Variants worth knowing across the genome: one homozygote, one carrier, one deletion, one HLA type'
  n_find:
  - 筛查范围：{cvn} 个有 ClinVar 记录的 PASS 变异（含插入缺失）、ACMG 建议报告的 81 个基因、{lof} 个蛋白编码功能丧失变异、Delly 结构变异。ACMG 81 基因中没有致病变异。罕见（频率 <1%）的功能丧失变异 {lofr} 个，其中纯合 {lofh} 个全部位于重复序列区，视为伪影。
  - 'Screened: {cvn} PASS variants with a ClinVar record (indels included), the 81 genes the ACMG recommends reporting, {lof} protein-coding loss-of-function variants, Delly structural variants. No pathogenic variant in the ACMG 81. {lofr} rare (<1%) loss-of-function variants, of which the {lofh} homozygous ones all sit in repeats and are treated as artefacts.'
  c_cv:
  - 和 ClinVar（{cvd} 版）比对：{cvn} 个位点有记录
  - 'Checked against ClinVar ({cvd}): {cvn} sites have a record'
  sub_cv:
  - 按 ClinVar 分类计数 · 只统计 PASS 变异
  - counts by ClinVar class · PASS variants only
  n_cv:
  - 绝大多数是良性。“致病/可能致病”一栏里非冲突且有评审的只有 CFTR 那一条；另外三条是无评审的旧记录（疟疾易感 NCR3、CDKN2B 保护性等位基因、Xg 血型），不是疾病。被质控过滤掉的变异里也查了一遍：CFTR 外显子 10 末位的 c.1392G>T 只有 5/35 读段支持、全部来自假基因的错误比对，过滤正确。
  - 'The great majority are benign. In the pathogenic / likely pathogenic row only the CFTR entry is reviewed and non-conflicting; the other three are old unreviewed records (NCR3 malaria susceptibility, a protective CDKN2B allele, the Xg blood group), not diseases. The filtered-out variants were checked too: CFTR c.1392G>T at the last base of exon 10 had 5 of 35 reads, all mis-mapped from a pseudogene; the filter was right.'
  c_la:
  - 把每条染色体拆成北方与南方两种来源
  - Every chromosome split into northern and southern origins
  sub_la:
  - 用 1000 Genomes 的北京汉+日本作北方参考、傣族+京族作南方参考 · 欧洲与南亚两个面板只用来量噪声 · FLARE 0.6
  - Beijing Han + Japanese as the northern reference, Dai + Kinh as the southern one; European and South Asian panels included only to measure the noise · FLARE 0.6
  lg_n:
  - 北方东亚
  - northern East Asian
  lg_s:
  - 南方东亚
  - southern East Asian
  lg_noise:
  - 欧洲 / 南亚（噪声）
  - European / South Asian (noise)
  n_la:
  - 南方成分不是均匀铺开，而是集中在少数长片段：最长一段在 18 号染色体 30.4–37.0 Mb（6.6 Mb），另有 8、10、4、3、20 号染色体上五段超过 3 Mb。片段越长说明流入越近，几 Mb 对应大约几十代。欧洲与南亚两个面板合计只拿到 {noise}%，这就是方法的噪声底，南方成分 {south}% 远在其上。
  - 'The southern component is not spread evenly but sits in a few long stretches: the longest on chromosome 18 at 30.4-37.0 Mb (6.6 Mb), with five more above 3 Mb on chromosomes 8, 10, 4, 3 and 20. Longer segments mean more recent arrival, a few Mb corresponding to some tens of generations. The European and South Asian panels together take only {noise}%, the method''s noise floor, and the southern share of {south}% sits far above it.'
  src_calib:
  - 把 20 名北京汉与 20 名南方汉从参考面板移出后用同一方法打分（1、2、6、22 号染色体）
  - 20 Beijing Han and 20 southern Han held out of the panel and scored the same way, on chromosomes 1, 2, 6 and 22
  n_calib:
  - 单独一个百分比没有意义，需要参照。用同样的面板给参考个体打分：北京汉平均 {chb}% 北方成分，南方汉 {chs}%。在同样这几条染色体上大宇是 {dayucal}%，比北京汉的平均值高 {sdchb} 个标准差。也就是说在“北方—南方”这条轴上，他比典型的北京汉样本更靠北。
  - A percentage means nothing without a yardstick. Scoring reference individuals through the same panels gives the Beijing Han a mean northern share of {chb}% and the southern Han {chs}%. On those same chromosomes {NAME_EN} comes out at {dayucal}%, which is {sdchb} standard deviations above the Beijing Han mean; on the north-south axis he sits further north than a typical Beijing Han sample.
  c_anc:
  - 和四千年前黄河流域的人群最像
  - Closest to people who lived in the Yellow River valley four thousand years ago
  sub_anc:
  - AADR Human Origins 面板 · 1,311 名现代东亚人建主成分空间 · 299 名古代个体投影 · 13.0 万个位点
  - AADR Human Origins panel · principal components built on 1,311 present-day East Asians · 299 ancient individuals projected · 130,012 markers
  src_hopca:
  - 空心方块 = 古代个体 · 汉族样本按省份标注
  - open squares = ancient individuals · Han samples labelled by province
  src_timedist:
  - 纵轴 = 该古代人群到大宇的距离 · 横轴 = 年代，越靠右越古老
  - 'vertical: distance from that ancient group to {NAME_EN} · horizontal: age, older to the right'
  n_anc:
  - 最近的现代人群是河南、山东、山西的汉族样本，三者之间的差距小于各自组内的离散度，无法进一步区分；与广东汉的距离则是组内离散度的七倍，区分清楚。最近的古代人群按年代排开是一条斜线：仰韶（约 6,950 年前）0.022，龙山（约 4,000 年前）0.010，商周（约 2,700 年前）0.007。距离随年代单调缩小，说明中原人群自新石器晚期以来连续，同时北方成分持续汇入。这个结论与上面的局部祖源互相独立地印证。
  - 'The nearest present-day groups are the Han samples from Henan, Shandong and Shanxi; the gaps between those three are smaller than the spread within each, so they cannot be separated further, while the distance to Guangdong Han is seven times that spread and clearly separates them. Sorted by age the nearest ancient groups fall on a line: Yangshao (about 6,950 years ago) at 0.022, Longshan (about 4,000 years ago) at 0.010, Shang and Zhou (about 2,700 years ago) at 0.007. The monotone decline says the central plains population has been continuous since the late Neolithic while northern ancestry kept flowing in, which is the same conclusion the local ancestry reaches independently.'
