  c_circos:
  - 一张图里的整个基因组
  - The whole genome in one figure
  sub_circos:
  - 22 条常染色体首尾相接排成一圈 · 从外到内四层：变异密度、局部祖源、古老人类片段、纯合区
  - 'the 22 autosomes laid end to end in a circle · four rings from the outside in: variant density, local ancestry, archaic segments, homozygous runs'
  src_circos:
  - 外圈刻度每 50 Mb · 短竖线 = 着丝粒 · 引出线标注确认的纯合基因缺失
  - ticks every 50 Mb · short bar = centromere · leader lines mark confirmed homozygous gene deletions
  n_circos:
  - 这张图是全书的目录：后面每一节讲的都是其中一环。密度环的起伏来自重组率与基因密度，着丝粒附近的低谷是可比对性的限制而非生物学。祖源环画的是两条单倍型，底色为北方东亚成分，橙色段为南方东亚。古老片段环与纯合区环都很稀疏，这本身就是结论：没有提示父母近亲的长纯合片段，古老人类成分零散分布在整个基因组上。
  - 'This figure is the table of contents: every later section expands one of its rings. The density ring rises and falls with recombination rate and gene density, and the dips near centromeres are a mappability limit rather than biology. The ancestry ring carries both haplotypes, with the northern East Asian component as the base colour and southern stretches in orange. The archaic and homozygosity rings are both sparse, which is itself the finding: no long homozygous runs pointing to related parents, and archaic ancestry scattered in short pieces across the genome.'
  c_chrom:
  - 每条染色体的测序深度和变异密度
  - Sequencing depth and variant density on each chromosome
  sub_chrom:
  - 左：平均深度 · 右：每 Mb 的 PASS 变异数 · 浅色 = X / Y / 线粒体
  - 'left: mean depth · right: PASS variants per Mb · light = X / Y / mitochondria'
  n_chrom:
  - X 的深度是常染色体的一半、Y 有读段：男性。Y 的平均深度低是因为它大半是不可比对的重复序列，能唯一比对的区域实际有 10–26×。线粒体 4,850× 足以看到低比例的异质性。
  - 'The X sits at half the autosomal depth and the Y has reads: male. The Y''s low average comes from its largely unmappable repeats; the uniquely mappable regions run at 10–26×. Mitochondria at 4,850× are deep enough to see low-level heteroplasmy.'
  c_y:
  - 父系：Y 染色体属于 {yterm}
  - 'Father''s line: the Y chromosome belongs to {yterm}'
  sub_y:
  - 从 O-F438 沿 YFull {ver} 树逐级下行 · 圆越大支持位点越多 · 直接读 CRAM 读段
  - descending from O-F438 on the YFull {ver} tree · bigger circle = more supporting sites · read straight from the CRAM
  n_y:
  - Y 染色体只从父亲传给儿子，记录的是父系一条线。O-M117 → F8 → F438 这段主干在汉族尤其北方汉族里很常见；F438 之下 Y17728、F1754、F2137、A16636、Y25189 逐级全部衍生态，兄弟支系全部祖先态。O-Y25189 是 YFull 树上的叶节点，估计形成于约 {yformed} 年前，属于 O-M117 之下在北方汉族中常见的一支。要再往下分，需要更多同支系的样本，可以把 Y 数据提交 YFull。
  - The Y chromosome passes only from father to son, so it records one paternal line. The trunk O-M117 → F8 → F438 is common among Han Chinese, especially in the north; under F438, Y17728, F1754, F2137, A16636 and Y25189 are all derived step by step, with every sister branch ancestral. O-Y25189 is a leaf on the YFull tree, formed roughly {yformed} years ago, a lineage under O-M117 common among northern Han. Going further needs more samples from the same branch; the Y data can be submitted to YFull.
  c_mt:
  - 母系：线粒体属于 {mthg}（可信度 {mtq}）
  - 'Mother''s line: mitochondria belong to {mthg} (confidence {mtq})'
  sub_mt:
  - 16,569 个位置全部测到 · 实心 = 支系定义位点 · 空心 = 私有变异 · PhyloTree 17.2
  - all 16,569 positions covered · filled = branch-defining · hollow = private · PhyloTree 17.2
  n_mt:
  - 线粒体只从母亲传下来，记录的是母系一条线；D4 是东亚最常见的母系支系之一。16,569 个位置全部测到，{mtn} 个支系定义位点命中，{mtp} 个私有变异。异质性（同一个人体内两种线粒体序列并存）只有 m.16093T>C 一处，占 90%，是已知的高变位点，没有健康含义。私有变异中的 m.3308T>C 改变 ND1 的起始密码子，在多个单倍群中是常见多态，一般视为良性。
  - 'Mitochondria pass only from the mother, one maternal line; D4 is among the commonest maternal branches in East Asia. All 16,569 positions are covered: {mtn} branch-defining sites found, {mtp} private variants. Heteroplasmy (two mitochondrial sequences coexisting in one person) appears only at m.16093T>C, at 90%, a known hypervariable site with no health meaning. Among the private variants m.3308T>C alters the ND1 start codon; it is a common polymorphism across several haplogroups and generally considered benign.'
  c_pca:
  - 和全世界 2,504 个人放在一起看：东亚，汉族，北京汉与南方汉之间偏北
  - 'Placed among 2,504 people worldwide: East Asian, Han, between Beijing and southern Han leaning north'
