  sub_kir:
  - 这一基因区的特别之处是不同人携带的基因数目本来就不同 · T1K 1.0 + IPD-KIR
  - what makes this region unusual is that people differ in which genes they carry at all · T1K 1.0 with IPD-KIR
  n_kir:
  - 大宇是 AA 单倍型：只有 KIR2DS4 一个活化性受体，其余全是抑制性受体。配体方面两个 HLA-C 等位基因都属 C1 组，KIR2DL3 因此有配体；两个 HLA-B 中 B*13:01 提供 Bw4 表位供 KIR3DL1 识别。AA 加 C1/C1 在东亚常见，整体偏抑制性。这些组合在文献中与感染、妊娠和移植结局有人群水平的关联，不作个体预测。
  - '{NAME_EN} has the AA haplotype: a single activating receptor, KIR2DS4, and inhibitory receptors otherwise. On the ligand side both HLA-C alleles belong to group C1, so KIR2DL3 has its ligand, and among the two HLA-B alleles B*13:01 supplies the Bw4 epitope that KIR3DL1 reads. AA together with C1/C1 is common in East Asia and tilts the balance towards inhibition. These combinations carry population-level associations with infection, pregnancy and transplant outcomes; they are not individual predictions.'
  c_som:
  - 血液本身的状态
