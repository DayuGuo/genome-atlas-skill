<style>
  .tiers{display:grid;grid-template-columns:1fr 1fr 1fr;gap:26px;margin:18px 0 6px}
  .tier h4{font-family:var(--num);font-weight:600;font-size:11px;letter-spacing:.2em;color:var(--muted);border-bottom:1px solid var(--ink);padding-bottom:6px;margin-bottom:8px}
  .tier.t1 h4{color:var(--ink)} .tier p{font-size:11.5px;line-height:1.7;color:var(--lab)} .tier.t1 p{color:var(--ink)}
  .callout{border-left:2px solid var(--ink);padding:6px 14px;margin:14px 0;font-size:11.5px;line-height:1.7;color:var(--lab);max-width:78ch}
  .callout b{color:var(--ink)}
  .finding{display:grid;grid-template-columns:150px 1fr;gap:0 22px;padding:14px 0;border-bottom:1px dotted var(--faint)}
  .finding:last-child{border-bottom:0}
  .finding .g{font-family:var(--num);font-weight:700;font-size:20px;line-height:1.1;letter-spacing:.02em}
  .finding .g small{display:block;font-size:9.5px;font-weight:600;letter-spacing:.12em;color:var(--muted);margin-top:4px;text-transform:uppercase}
  .finding .b{font-size:11.5px;line-height:1.7;color:var(--lab)} .finding .b b{color:var(--ink)}
  .finding .act{margin-top:6px;font-size:11px;color:var(--ink);font-weight:600}
  .stamp{display:inline-block;font-family:var(--num);font-size:9px;font-weight:600;letter-spacing:.14em;padding:1px 7px;border:1px solid var(--ink);color:var(--ink);border-radius:3px;margin-left:8px;vertical-align:middle;text-transform:uppercase}
  .stamp.hot{background:var(--ink);color:var(--bg)}
  .hlagrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 26px;margin:10px 0 4px}
  .hlagrid div{border-top:1px solid var(--quiet);padding-top:6px}
  .hlagrid .k{font-size:9px;font-weight:700;letter-spacing:.14em;color:var(--muted)} .hlagrid .v{font-family:var(--num);font-weight:600;font-size:14px;letter-spacing:.04em;margin-top:2px}
  .hlagrid .v em{font-style:normal;color:var(--data)}
  .lvl{display:inline-block;font-family:var(--num);font-size:9px;font-weight:600;letter-spacing:.1em;padding:1px 6px;border:1px solid var(--faint);color:var(--muted);border-radius:3px;white-space:nowrap}
  @media(max-width:820px){.tiers{grid-template-columns:1fr}.finding{grid-template-columns:1fr}.hlagrid{grid-template-columns:1fr 1fr}}
</style>
