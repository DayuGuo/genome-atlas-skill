<style>

  @media (prefers-color-scheme: dark){

      --quiet:rgba(237,239,241,.16); --grid:rgba(237,239,241,.16); --track:rgba(237,239,241,.12);
      --data:#809EC6; --data2:#4D82C6; --faintdata:#263E5E; --hero:#EDEFF1; --halo:rgba(8,31,92,.92);
    }
  }
  :root[data-theme="dark"]{
    --bg:#081F5C; --ink:#EDEFF1; --muted:rgba(237,239,241,.62); --lab:rgba(237,239,241,.74); --faint:rgba(237,239,241,.36);
    --quiet:rgba(237,239,241,.16); --grid:rgba(237,239,241,.16); --track:rgba(237,239,241,.12);
    --data:#809EC6; --data2:#4D82C6; --faintdata:#263E5E; --hero:#EDEFF1; --halo:rgba(8,31,92,.92);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:'Inter','Noto Sans SC',sans-serif;
    -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums lining-nums;
    display:flex;justify-content:center;padding:56px 24px;line-height:1.5}
  .sheet{width:1080px;max-width:100%;display:grid;grid-template-columns:110px 1fr}
  .spine{position:relative;border-right:1px solid var(--ink)}
  .spine .t{position:sticky;top:24px;writing-mode:vertical-rl;font-family:var(--cn);font-weight:900;font-size:52px;line-height:1.1;letter-spacing:.08em;white-space:nowrap;margin-left:14px}
  html[lang="en"] .spine .t{font-family:'Oswald',sans-serif;font-weight:700;font-size:44px;letter-spacing:.18em}
  .spine .b{position:absolute;bottom:0;left:48px;writing-mode:vertical-rl;font-size:9px;font-weight:700;letter-spacing:.26em;color:var(--muted)}
  .content{padding-left:40px;min-width:0}
  .tophead{display:flex;gap:18px;align-items:baseline;border-bottom:1px solid var(--ink);padding-bottom:10px;margin-bottom:34px;flex-wrap:wrap}
  .tophead .site{font-family:var(--num);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
  .tophead .sep{color:var(--faint)}
  .tophead .tag{font-size:10px;font-weight:600;letter-spacing:.12em;color:var(--muted);flex:1}
  .lang{font-family:var(--num);font-size:11px;font-weight:600;letter-spacing:.14em;border:1px solid var(--ink);color:var(--ink);background:transparent;padding:3px 12px;border-radius:99px;cursor:pointer}
  .lang:hover,.lang:focus-visible{background:var(--ink);color:var(--bg);outline:none}
  .lede{font-size:13.5px;line-height:1.8;max-width:66ch;color:var(--lab);margin-bottom:8px}
  .lede b{color:var(--ink)}
  .secthead{display:flex;align-items:baseline;gap:14px;margin:48px 0 8px}
  .secthead .line{flex:1;border-top:1px solid var(--ink)}
  .secthead .t{font-family:var(--cn);font-weight:700;font-size:15px;letter-spacing:.2em}
  html[lang="en"] .secthead .t{font-family:'Oswald',sans-serif;font-weight:600;font-size:14px;letter-spacing:.22em}
  .secthead .k{font-family:var(--num);font-size:11px;letter-spacing:.14em;color:var(--muted)}
  .claim{font-size:13px;font-weight:700;margin:4px 0 2px;text-wrap:balance}
  .note{font-size:11.5px;line-height:1.75;color:var(--muted);max-width:72ch;margin:6px 0 10px}
  .note b{color:var(--ink);font-weight:600}
  .fig svg{width:100%;height:auto;display:block;overflow:visible}
  svg text{font-family:'Inter','Noto Sans SC',sans-serif}
  .sub{font-size:11.5px;color:var(--muted);margin:2px 0 12px}
  .srcline{font-size:9px;font-weight:600;letter-spacing:.1em;color:var(--faint);margin-top:8px;text-transform:uppercase}
  .note{margin-top:10px}
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:40px}
  .duo.w{grid-template-columns:1.25fr 1fr}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:14px;border-top:1px solid var(--ink)}
  .stats>div{padding:22px 20px 6px;border-right:1px dotted var(--faint)}
  .stats>div:first-child{padding-left:0}
  .stats>div:last-child{border-right:0;padding-right:0}
  .kpi .v{font-family:var(--num);font-weight:700;font-size:38px;line-height:1}
  .kpi .v small{font-size:18px;font-weight:600;color:var(--muted);margin-left:2px}
  .kpi .r{font-size:10.5px;font-weight:700;color:var(--muted);margin-top:6px}
  .kpi .l{font-size:9.5px;font-weight:600;letter-spacing:.12em;color:var(--faint);margin-top:3px;text-transform:uppercase}
  table{width:100%;border-collapse:collapse;font-size:11.5px}
  th{font-size:9.5px;font-weight:700;letter-spacing:.12em;color:var(--muted);text-align:left;padding:6px 8px 6px 0;border-bottom:1px solid var(--ink);text-transform:uppercase}
  td{padding:7px 8px 7px 0;border-bottom:1px dotted var(--faint);vertical-align:top;line-height:1.55}
  tr:last-child td{border-bottom:0}
  td.g{font-family:var(--num);font-weight:600;font-size:14px;letter-spacing:.06em;white-space:nowrap}
  td.rs{color:var(--muted);white-space:nowrap;font-size:10.5px}
  td.gene{font-weight:700;white-space:nowrap}
  td.num{font-family:var(--num);font-weight:600;white-space:nowrap}
  .pill{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.08em;padding:1px 7px;border:1px solid var(--data);color:var(--data);border-radius:99px;margin-left:6px;vertical-align:middle}
  .pill.hi{background:var(--data);color:var(--bg)}
  .tablewrap{overflow-x:auto}
  .cat{font-family:var(--cn);font-weight:700;font-size:12px;letter-spacing:.14em;margin:18px 0 4px;color:var(--ink)}
  html[lang="en"] .cat{font-family:'Oswald',sans-serif;letter-spacing:.16em;text-transform:uppercase}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);margin:6px 0 4px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--data)}
  .legend i.d2{background:var(--data2)} .legend i.fd{background:var(--faintdata)} .legend i.me{background:var(--hero);width:11px;height:11px;transform:rotate(45deg);border-radius:0}
  .disclaimer{margin-top:40px;padding:16px 0 0;border-top:1px dotted var(--faint);font-size:10.5px;line-height:1.75;color:var(--muted);max-width:80ch}
  .foot{margin-top:40px;border-top:1px solid var(--ink);padding-top:12px;display:flex;justify-content:space-between;font-size:9px;font-weight:600;letter-spacing:.12em;color:var(--muted);flex-wrap:wrap;gap:8px}
  .pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.7,.3,1.3) both}
  @keyframes pop{from{transform:scale(0)}to{transform:none}}
  .fade{animation:fade .9s ease both}
  @keyframes fade{from{opacity:0}}
  .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s cubic-bezier(.4,0,.2,1) both}
  @keyframes draw{to{stroke-dashoffset:0}}
  @media (prefers-reduced-motion:reduce){.pop,.fade{animation:none}.draw{animation:none;stroke-dasharray:none;stroke-dashoffset:0}}
  @media(max-width:820px){.sheet{grid-template-columns:1fr}.spine{display:none}.content{padding-left:0}.duo,.duo.w{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stats>div:nth-child(2){border-right:0}}
</style>
<style>
  .tiers{display:grid;grid-template-columns:1fr 1fr 1fr;gap:26px;margin:18px 0 6px}
  .tier h4{font-family:var(--num);font-weight:600;font-size:11px;letter-spacing:.2em;color:var(--muted);border-bottom:1px solid var(--ink);padding-bottom:6px;margin-bottom:8px}
  .tier.t1 h4{color:var(--ink)}
  .tier p{font-size:11.5px;line-height:1.7;color:var(--lab)}
  .tier.t1 p{color:var(--ink)}
  .lvl{display:inline-block;font-family:var(--num);font-size:9px;font-weight:600;letter-spacing:.1em;padding:1px 6px;border:1px solid var(--faint);color:var(--muted);border-radius:3px;white-space:nowrap}
  .lvl.A{border-color:var(--ink);color:var(--ink)} .lvl.B{border-color:var(--data);color:var(--data)}
  .src-tag{font-size:8.5px;color:var(--faint);letter-spacing:.06em;display:block;margin-top:2px}
  .callout{border-left:2px solid var(--ink);padding:6px 14px;margin:14px 0;font-size:11.5px;line-height:1.7;color:var(--lab);max-width:78ch}
  @media(max-width:820px){.tiers{grid-template-columns:1fr}}
</style>

> O-M1706 (F5/F8) > O-A9459 > O-F438","yfull_version":"9.05.0","formed_years":7000,"path_nodes":["NO","O","O2","O2a","O2a2","O2a2b","O2a2b1","O2a2b1a","O2a2b1a1","O2a2b1a1a","O2a2b1a1a1"]},"mt_lines":[["关键定义位点：5178A (D)、3010A (D4)、8414T、14668T (D4)、3644C、9540C (D4h)、16174T (D4h1)","私有突变：146C、3308C、7673G、9300A、16093C、16172C（3308C 在文献中与 D4h1 部分支系相关）"],["Key defining sites: 5178A (D), 3010A (D4), 8414T, 14668T (D4), 3644C, 9540C (D4h), 16174T (D4h1)","Private: 146C, 3308C, 7673G, 9300A, 16093C, 16172C (3308C is reported in some D4h1 sub-branches)"]]}; const PLAIN = {"rs671": ["你带一个“喝酒脸红”基因（ALDH2*2）。酒精变成的乙醛分解得慢，喝酒容易脸红、心跳快、难受。长期大量饮酒的人如果带这个基因，食管癌风险会更高。这是直接测出来的，很可靠。", "You carry one 'alcohol flush' variant (ALDH2*2). Your body clears acetaldehyde, the toxic by-product of alcohol, slowly, so drinking tends to cause flushing and discomfort. Heavy drinkers with this variant have a higher oesophageal cancer risk. Directly measured, reliable."], "rs1229984": ["你把酒精转成乙醛的速度很快（ADH1B*2 纯合）。和上一条加在一起，喝酒后乙醛堆得更快，不舒服来得更早。东亚人大多是这个型。", "You convert alcohol to acetaldehyde quickly (ADH1B*2, two copies). Combined with the line above, acetaldehyde builds up fast after drinking. Most East Asians have this type."], "rs3827760": ["东亚人常见的“粗直头发”基因型。头发偏粗偏直、门牙内侧呈铲形的可能性大，但这只是趋势，不是必然。", "The East Asian 'thick straight hair' type. Thick straight hair and shovel-shaped incisors are more likely, but this is a tendency, not a certainty."], "rs17822931": ["干性耳垢，腋下体味轻。这个基因几乎决定耳垢类型，东亚人绝大多数如此。", "Dry earwax and little underarm odour. This gene almost fully determines earwax type; most East Asians have this."], "rs4988235": ["你没有欧洲人那种“成年后还能消化牛奶”的基因。成年后喝多了牛奶容易胀气、拉肚子，这在中国人里是常态。少量奶制品或酸奶、奶酪通常没问题。", "You lack the European 'keep digesting milk as an adult' variant. Larger amounts of milk may cause bloating or diarrhoea, which is the norm in China. Small amounts, yoghurt and cheese are usually fine."], "rs182549": ["和上一条一致。", "Consistent with the line above."], "rs429358": ["APOE 基因型是 ε3/ε4：你带一个 ε4。ε4 是老年痴呆（阿尔茨海默病）最常见的风险基因之一，带一个会让风险比一般人高一些，但大多数带 ε4 的人一辈子不会得病，它不是“致病基因”。这两个位点都是直接测出的，基因型本身很可靠。", "Your APOE type is ε3/ε4: one copy of ε4. ε4 is the most common risk gene for late-onset Alzheimer's disease; one copy raises the odds somewhat, but most people with ε4 never develop it, and it is not a 'disease gene'. Both sites were measured directly, so the genotype itself is reliable."], "rs7412": ["见上一条。", "See the line above."], "rs1815739": ["肌肉基因 ACTN3 一份正常、一份失活。研究说这和爆发力、耐力略有关系，但影响很小，看不出个人差别。", "One working and one inactive copy of the muscle gene ACTN3. Studies link it loosely to sprint versus endurance ability, but the effect is tiny and not visible in an individual."], "rs1801133": ["MTHFR 677TT：叶酸代谢酶的活性大约只有常人的三成。北方汉族每四五个人就有一个是这个型。它本身不是病，也不需要因此吃叶酸；医学指南不建议为这个基因做常规检测。", "MTHFR 677TT: your folate-processing enzyme works at roughly 30% of normal. About one in four or five northern Han people have this. It is not a disease and is not a reason to take folate; medical guidelines advise against routine testing for it."], "rs1801131": ["正常型。", "Normal type."], "rs762551": ["咖啡因分解偏慢的型。可能咖啡喝晚了更影响睡眠，但个体差异很大，只是参考。", "The slower caffeine-clearing type. Late coffee may affect sleep more, but people vary a lot; treat as a hint only."], "rs5751876": ["常见型。有研究说另一种型的人喝咖啡更容易紧张，证据不强。", "Common type. Some studies link the other type to caffeine jitters; weak evidence."], "rs4680": ["COMT 基因 Val/Val 型：大脑里分解多巴胺偏快。网上流传的“战士型/忧虑型”说法证据很弱，不要当真。", "COMT Val/Val: dopamine is broken down a little faster in the brain. The popular 'warrior/worrier' story has weak evidence; do not take it seriously."], "rs6265": ["BDNF 常见型。和性格、记忆的关联在个人层面没有预测价值。", "Common BDNF type. Links to personality or memory have no predictive value for an individual."], "rs1800497": ["常见型。这个位点其实在 ANKK1 基因上，网上说的“多巴胺受体少”没有可靠依据。", "Common type. The site is actually in the ANKK1 gene; the 'fewer dopamine receptors' claim lacks solid support."], "rs4244285": ["没测到 CYP2C19*2。但这张芯片没有测 *17 等其他版本，所以不能说你的 CYP2C19 代谢“正常”，只能说测过的两个慢代谢版本都没有。", "CYP2C19*2 not found. The array does not test *17 and other versions, so this cannot be called 'normal' metabolism, only 'the two slow versions tested are absent'."], "rs4986893": ["没测到 CYP2C19*3。见上一条。", "CYP2C19*3 not found. See above."], "rs1799853": ["没测到 CYP2C9*2。同样不能据此说“代谢正常”。", "CYP2C9*2 not found. Again this does not prove 'normal' metabolism."], "rs1057910": ["没测到 CYP2C9*3。", "CYP2C9*3 not found."], "rs9923231": ["VKORC1 是“华法林敏感”型：如果将来用华法林这种抗凝药，通常需要的剂量偏小。东亚人八成以上都是这个型。具体剂量要医生根据多项指标决定。", "VKORC1 'warfarin-sensitive' type: if you ever need the blood thinner warfarin, the usual dose tends to be lower. Over 80% of East Asians have this. The actual dose is a doctor's decision based on several factors."], "rs4149056": ["没测到会增加他汀类药物肌肉副作用的常见变异。", "The common variant that raises the risk of muscle side-effects from statins was not found."], "rs116855232": ["重要：你带一个 NUDT15 变异。如果将来要用硫唑嘌呤、6-巯基嘌呤这类药（常用于免疫病、白血病、器官移植），起始剂量通常要减少，否则骨髓抑制风险高。请把这条告诉医生，用药前做正规检测确认。不要自己调药。", "Important: you carry one NUDT15 variant. If you ever need thiopurine drugs (azathioprine, 6-mercaptopurine; used for autoimmune disease, leukaemia, transplants), the starting dose is usually reduced to avoid bone-marrow suppression. Tell your doctor and confirm with a clinical test before use. Never adjust medication yourself."], "rs1065852": ["没测到 CYP2D6*10。但 CYP2D6 的完整判断需要测很多东西（包括基因拷贝数），一个位点说明不了代谢快慢。", "CYP2D6*10 not found. But CYP2D6 needs many measurements (including gene copy number); one site cannot tell how fast you metabolise."], "rs9263726": ["没带 HLA-B*58:01 的“标签”位点。这个 HLA 类型和痛风药别嘌醇的严重皮肤反应有关。标签不是真正的 HLA 分型，如果要用别嘌醇，医院会直接测。", "You do not carry the 'tag' for HLA-B*58:01, the type linked to severe skin reactions to the gout drug allopurinol. A tag is not true HLA typing; hospitals test it directly before prescribing."], "rs7903146": ["带一个 2 型糖尿病常见风险变异，风险比不带的人高三到四成。这是人群统计，个人风险主要还是看体重、饮食和运动。", "One copy of the most common type 2 diabetes risk variant, roughly 30–40% higher odds than non-carriers. A population statistic; personal risk depends far more on weight, diet and exercise."], "rs9939609": ["FTO 肥胖基因是普通型。", "Common (lower-risk) type of the FTO obesity gene."], "rs1801282": ["普通型。", "Common type."], "rs1333049": ["带一个冠心病常见风险变异，效应小（约两三成）。", "One copy of a common coronary-disease risk variant; small effect (about 20–30%)."], "rs6983267": ["带两个常见的肠癌、前列腺癌风险变异，效应小。", "Two copies of a common bowel/prostate cancer risk variant; small effect."], "rs2187668": ["没带乳糜泻（麸质不耐受）最主要的 HLA 标签。标签不等于 HLA 分型。", "You lack the main HLA tag for coeliac disease. A tag is not HLA typing."], "rs7454108": ["没带乳糜泻第二个 HLA 标签。", "You lack the second coeliac HLA tag."], "rs2476601": ["这个自身免疫病变异在东亚人里几乎不存在，你是正常型，符合预期。", "This autoimmune variant is almost absent in East Asians; you have the normal type, as expected."], "rs1800562": ["没带遗传性血色病（铁过载）的主要变异，东亚人几乎都没有。", "You lack the main haemochromatosis (iron overload) variant, which is almost absent in East Asians."], "rs1799945": ["没带 HFE H63D。", "HFE H63D not carried."], "rs334": ["芯片没测这个位点。", "Not on the array."], "rs12913832": ["棕色眼睛的基因型。", "Brown-eye genotype."], "rs1426654": ["肤色基因是东亚常见型（不是欧洲浅肤色型）。", "The East Asian skin-pigment type (not the European light-skin variant)."], "rs16891982": ["同上。", "Same as above."], "rs885479": ["MC1R 东亚常见型，对外貌影响很小。", "The common East Asian MC1R type; minor effect on appearance."], "rs1805007": ["没带红发变异。", "Red-hair variant not carried."], "rs713598": ["PTC 苦味“不敏感”型（AVI/AVI）：决定这个味觉的三个位点你都是不敏感型，所以结论确定。像西兰花、苦瓜的某些苦味你可能感觉不明显。", "'Non-taster' for the bitter compound PTC (AVI/AVI): all three sites that decide this are the non-taster type, so the call is solid. Some bitterness in broccoli or bitter melon may seem mild to you."], "rs10427255": ["看强光打喷嚏的倾向偏低。趣味性关联，证据一般。", "Low tendency to sneeze in bright light. A fun association with modest evidence."], "rs601338": ["正常。", "Normal."], "rs1047781": ["你是“分泌型”：某些血型物质会出现在唾液和肠道里。这和肠道菌群、诺如病毒易感性有些关系，但对日常生活没有实际影响。", "You are a 'secretor': certain blood-group substances appear in saliva and the gut. Loosely linked to gut bacteria and norovirus susceptibility; no practical impact on daily life."], "rs8176719": ["根据 ABO 血型的几个关键位点推测你是 A 型血（A/A）。芯片测这种缺失变异的准确度不算高，以医院验血为准。", "From the key ABO sites the prediction is blood group A (A/A). The array is not very accurate on this kind of deletion variant, so a hospital blood test is the final word."], "rs8176746": ["没有 B 型的标记，见上一条。", "No B-type marker; see above."], "rs2814778": ["Duffy 血型阳性（普通型）。", "Duffy blood-group positive (common type)."], "rs1051730": ["尼古丁依赖相关位点是普通型。", "Common type of a nicotine-dependence site."], "rs11209026": ["这个克罗恩病保护性变异在东亚人里几乎没有，你是普通型，符合预期。", "This protective Crohn's variant is almost absent in East Asians; common type, as expected."], "rs5030868": ["没带南方中国最常见的 G6PD 缺乏（蚕豆病）变异。但芯片没测其他几种，不能完全排除。", "You lack the commonest southern-Chinese G6PD (favism) variant. Other variants were not tested, so it cannot be fully excluded."], "rs72554664": ["芯片没测。", "Not on the array."], "rs137852328": ["芯片没测。", "Not on the array."], "rs2802292": ["没带 FOXO3 的“长寿”变异。这种关联很弱，带不带都说明不了寿命。", "You lack the FOXO3 'longevity' variant. The association is weak; it says nothing about lifespan either way."], "rs2764264": ["同上。", "Same as above."], "rs5882": ["CETP 杂合。长寿关联证据弱。", "CETP heterozygous. Weak longevity association."], "rs1801260": ["CLOCK 基因常见型，有研究说偏“早起型”，但证据不一致。", "Common CLOCK type; some studies call it 'morning-leaning', but findings are inconsistent."], "rs73598374": ["ADA 常见型。", "Common ADA type."], "rs4343": ["ACE 基因是 D/D 型（芯片直接测了那段插入缺失）。有研究说 D/D 偏力量型、血压略高，效应小，别当真。", "ACE D/D type (the array typed the insertion/deletion itself). Some studies link D/D to strength-type athletics and slightly higher blood pressure; small effects, not to be taken seriously."], "rs17070145": ["KIBRA 杂合。有研究说和记忆力有关，重复研究结果不一致。", "KIBRA heterozygous. Some studies link it to memory; replications disagree."], "rs6746030": ["疼痛敏感度相关位点是普通型。", "Common type of a pain-sensitivity site."], "rs4961": ["ADD1 是“盐敏感”型纯合，有研究说这类人少吃盐降压更明显，但各研究结果不一致，不能作为个人饮食建议。少吃盐对谁都有好处。", "ADD1 'salt-sensitive' type (two copies). Some studies say such people respond more to cutting salt, but results disagree, so this is not personal dietary advice. Less salt is good for everyone."], "rs6152": ["雄激素受体常见型。", "Common androgen-receptor type."], "rs1160312": ["脱发相关位点是普通型。", "Common type of a hair-loss site."], "rs13266634": ["带两个常见的糖尿病相关变异，效应小。", "Two copies of a common diabetes-related variant; small effect."], "rs11591147": ["没带天生低胆固醇的 PCSK9 变异（东亚人几乎都没有）。", "You lack the naturally-low-cholesterol PCSK9 variant (almost absent in East Asians)."], "rs4481887": ["更可能闻不到吃芦笋后尿里的特殊气味。趣味性关联。", "More likely unable to smell 'asparagus urine'. A fun association."], "rs12203592": ["没带雀斑相关变异。", "Freckle variant not carried."]}; const PGX_PLAIN = {"NUDT15": ["带一个 NUDT15 变异。将来若用硫唑嘌呤、6-巯基嘌呤这类药，起始剂量通常要减少。请告诉医生，用药前做正规检测（NUDT15 加 TPMT）确认。不要自己调药。", "One NUDT15 variant. If thiopurine drugs (azathioprine, 6-mercaptopurine) are ever prescribed, the starting dose is usually reduced. Tell your doctor and confirm with a clinical NUDT15 + TPMT test. Never adjust medication yourself."], "TPMT": ["TPMT 是和 NUDT15 一起看的另一个硫嘌呤药物基因。测过的三个变异都没有。", "TPMT is the other thiopurine gene, read together with NUDT15. None of the three tested variants were found."], "VKORC1": ["华法林敏感型：通常需要的剂量偏小。具体剂量由医生根据多项指标和凝血检查决定。", "Warfarin-sensitive type: the usual dose tends to be lower. The actual dose is set by a doctor from several factors and blood tests."], "CYP2C19": ["测过的两个慢代谢版本（*2、*3）都没有。但芯片没测 *17 等版本，所以不能说“代谢正常”。这个基因影响氯吡格雷、部分胃药和抗抑郁药。", "The two slow versions tested (*2, *3) are absent. The array does not test *17 and others, so 'normal metabolism' cannot be claimed. This gene affects clopidogrel, some stomach drugs and antidepressants."], "CYP2C9": ["测过的 *2、*3 都没有。影响华法林和部分止痛药。", "Tested *2 and *3 are absent. Affects warfarin and some painkillers."], "CYP2D6": ["没测到 *10。但这个基因要完整判断需要测很多东西，一个位点说明不了。影响多种抗抑郁药、止痛药、他莫昔芬。", "*10 not found. Full assessment of this gene needs many measurements; one site is not enough. Affects many antidepressants, painkillers and tamoxifen."], "CYP4F2": ["普通型，华法林剂量的次要影响因素。", "Common type; a minor factor in warfarin dosing."], "SLCO1B1": ["没带增加他汀类药物肌肉副作用的常见变异。", "The common variant raising statin muscle side-effects is absent."], "HLA-B*58:01": ["没带和痛风药别嘌醇严重皮肤反应有关的 HLA 标签。这不是真正的 HLA 分型，用药前医院会直接测。", "You lack the tag for the HLA type linked to severe skin reactions to allopurinol. Not true HLA typing; hospitals test it directly before prescribing."], "HLA-B*15:02": ["和卡马西平（一种抗癫痫药）严重皮肤反应有关的 HLA 类型，芯片上两个标签位点都是普通型，但本次没有独立核实标签的可靠性，所以不下结论。", "The HLA type linked to severe skin reactions to carbamazepine (an epilepsy drug): both tag sites are the common type, but tag reliability was not independently verified here, so no conclusion is drawn."], "DPYD": ["影响氟尿嘧啶类化疗药毒性的几个关键变异都没有（其中一个芯片没测）。之前列出的 rs1801159 属于正常功能变异，不需要在意。", "The key variants that make fluorouracil-type chemotherapy toxic are absent (one not tested). The previously listed rs1801159 is a normal-function variant and can be ignored."], "UGT1A1": ["没带 *6；带一个 *28 的标签。这种组合（*1/*28）不属于需要调整伊立替康化疗剂量的类型。不能据此说你有 Gilbert 综合征（一种无害的胆红素偏高体质）。", "*6 absent; one copy of the *28 tag. This combination (*1/*28) does not require dose changes for irinotecan chemotherapy. It does not establish Gilbert syndrome (a harmless tendency to higher bilirubin)."], "ALDH2": ["“喝酒脸红”基因（*1/*2）。另外，含服的硝酸甘油（心绞痛急救药）在这类人身上效果会差一些。", "The 'alcohol flush' gene (*1/*2). Also, sublingual nitroglycerin (for angina) works less well in people with this type."], "G6PD": ["没带南方中国最常见的 G6PD 缺乏（蚕豆病）变异 Canton；Kaiping、Union 两个位点芯片没测，不能完全排除。", "The commonest southern-Chinese G6PD (favism) variant, Canton, is absent; the Kaiping and Union sites are not on the array, so deficiency cannot be fully excluded."]}; const PGX_COV = {"NUDT15": ["测了最关键的 R139C 位点", "The key R139C site tested"], "TPMT": ["测了 *2、*3B、*3C", "*2, *3B, *3C tested"], "VKORC1": ["测了决定性位点 −1639", "The defining −1639 site tested"], "CYP2C r} 个位点也是），所以判断性别主要靠 Y 染色体 {yc} 个位点被测出来。", "Heterozygosity is the share of sites where the two parental copies differ; all autosomes are in the normal range. The X is entirely homozygous: a male has one X and WeGene writes it as two identical copies (even the {par} sites in the region that really is two-copy), so sex is inferred mainly from {yc} Y sites being called."], "src_y": ["每个圆 = 这一级有多少个位点支持 · ISOGG 2016 位点表 · 名称与 YFull 9.05 核对", "each circle = sites supporting that step · ISOGG 2016 index · names checked against YFull 9.05"], "src_mt": ["线粒体 16,569 个位置展开 · 空心点 = 私有变异 · PhyloTree 17.2", "mitochondrial genome unrolled · hollow = private · PhyloTree 17.2"], "lg_eas": ["东亚人", "East Asians"], "lg_other": ["其他大洲的人", "people from other continents"], "src_pg": ["1000 Genomes 项目 2,504 人 · 用 {n} 个位点计算 · 离你最近的人群 {near}", "1000 Genomes, 2,504 people · {n} sites · nearest group {near}"], "src_pe": ["东亚 504 人 · {n} 个位点 · 最近的人群 {near} · 离你最近的 15 个人：{knn}", "504 East Asians · {n} sites · nearest group {near} · your 15 nearest people: {knn}"], "src_h12": ["HGDP 2019 · {n} 个位点 · 你的数据先换算到 GRCh38 坐标（{lift} 个位点成功）", "HGDP 2019 · {n} sites · your data lifted to GRCh38 ({lift} sites)"], "src_hd": ["到各人群中心的距离，越短越近 · 离你最近的 15 个人：{knn}", "distance to each group's centre, shorter = closer · your 15 nearest: {knn}"], "th_trait": ["项目", "Trait"], "th_gene": ["基因", "Gene"], "th_gt": ["你的型", "Your type"], "th_int": ["这意味着什么", "What it means"], "th_lvl": ["等级", "Grade"], "n_tr": ["等级：A = 直接测出且意义明确；B = 由几个位点或标签推断；C = 人群统计；D = 只是有研究提过，个人层面看不出差别。已删掉的位点（证据不足）：{removed}。", "Grades: A = measured directly with a clear meaning; B = inferred from several sites or a tag; C = population statistics; D = mentioned in some studies, no visible effect on an individual. Removed sites (insufficient evidence): {removed}."], "th_var": ["位点", "Sites"], "th_cov": ["测了哪些版本", "Versions tested"], "th_ph": ["能判断代谢型吗", "Metaboliser type?"], "th_act": ["指南", "Guideline"], "th_read": ["这意味着什么", "What it means"], "src_prs": ["实心点 = 在东亚 504 人里的百分位 · 空心点 = 在汉族 208 人里 · 灰带 = 中间一半的人 · 括号 = 覆盖率 / 权重保留 / 严格过滤后的结果", "filled = percentile among 504 East Asians · hollow = among 208 Han · band = middle half · brackets = coverage / weight kept / strict-filter result"], "src_prs_old": ["第一版百分位 ± 实测误差（十分之一的人会超出的范围） · audit/04_prs_validation.tsv", "first-version percentile ± measured error (exceeded by one in ten people) · audit/04_prs_validation.tsv"], "src_cv": ["按 ClinVar 的分类计数", "counts by ClinVar classification"], "src_roh": ["深色段 = 两份完全一样的长片段 · 小刻度 = 着丝粒 · 父母是近亲时会出现很长的深色段", "dark = long stretches where both copies are identical · tick = centromere · related parents produce very long dark stretches"], "th_pos": ["位置", "Position"], "th_al": ["变异", "Allele"], "th_feas": ["东亚频率", "EAS freq."], "th_fall": ["全球频率", "Global freq."], "th_cons": ["后果", "Consequence"], "c_meth": ["用了什么数据和工具，审计文件在哪", "Data, tools and where the audit files are"], "meth": ["<b>数据</b> WeGene 导出 {sites} 个位点（{nrs} 个 rsID + {nw} 个 WeGene 编号，{ind} 个插入缺失），GRCh37 坐标，正链（{n} 个位点与 1000 Genomes 比对零错位）。<b>参考数据</b> 1000 Genomes 第三期；HGDP 2019；ClinVar {cvd}；PGS Catalog；ISOGG 2016 与 YFull 9.05；PhyloTree 17.2；Ensembl。<b>工具</b> plink2、Beagle 5.4、haplogrep3、yhaplo、pyliftover。<b>审计</b> audit/00–08：执行摘要、流水线审计、逐条结论审计、用药基因、多基因评分、性状、再分析计划、修订报告、变更日志。", "<b>Data</b> WeGene export, {sites} sites ({nrs} rsIDs + {nw} WeGene IDs, {ind} indels), GRCh37, plus strand ({n} sites checked against 1000 Genomes with zero mismatches). <b>References</b> 1000 Genomes phase 3; HGDP 2019; ClinVar {cvd}; PGS Catalog; ISOGG 2016 and YFull 9.05; PhyloTree 17.2; Ensembl. <b>Tools</b> plink2, Beagle 5.4, haplogrep3, yhaplo, pyliftover. <b>Audit</b> audit/00–08: executive summary, pipeline audit, claim audit, medicines, polygenic scores, traits, reanalysis plan, corrected report, change log."], "disc": ["本页来自消费级基因检测芯片和公开数据库，用于个人了解和学习，不是医学诊断，也不是用药建议。凡涉及用药或疾病的内容，行动前请找医生做正规检测确认。第一版报告和结果保留在 results/ 里没有改动。", "This page comes from a consumer genotyping array and public databases, for personal interest and learning; it is neither a diagnosis nor medication advice. Anything about medicines or disease should be confirmed by a doctor with proper testing before acting. The first-version report and results are kept unchanged in results/."], "foot1": ["DAYU GENOME", "DAYU GENOME"], "foot2": ["scripts/01–18 · audit/00–08 · results_v2/", "scripts/01–18 · audit/00–08 · results_v2/"], "tag": ["男 · 1994 年生 · WeGene 基因检测芯片 · 修订版 2026-09-08", "Male · born 1994 · WeGene genotyping array · revised 2026-09-08"], "tier1_b": ["检测数据质量好（{sites} 个位点，成功率 {cr}%）。是男性。祖源是东亚人，在汉族里偏北方。带一个“喝酒脸红”基因（ALDH2）。带一个影响硫嘌呤类药物剂量的基因变异（NUDT15），将来用这类药前要告诉医生。APOE 基因型是 ε3/ε4。", "Good data quality ({sites} sites, {cr}% call rate). Male. East Asian ancestry, on the northern side of the Han spectrum. One 'alcohol flush' variant (ALDH2). One NUDT15 variant that affects thiopurine drug dosing; tell a doctor before using such drugs. APOE type ε3/ε4."], "tier2_b": ["父系（Y 染色体）属于 O-F438 这一支；母系（线粒体）属于 D4h1，这两个都是东亚常见支系。血型推测为 A 型。PTC 苦味“不敏感”型。没有看到父母近亲的迹象。华法林“敏感型”。", "Paternal line (Y) belongs to branch O-F438; maternal line (mitochondria) to D4h1, both common in East Asia. Predicted blood group A. PTC bitter 'non-taster'. No sign of parental relatedness. Warfarin-'sensitive' type."], "tier3_b": ["各种“多基因风险评分”（几十万个小效应位点加总的分数）；性格、记忆、运动、长寿、睡眠、盐敏感这类位点；在东亚人里少见的变异；染色体逐条的南北倾向；母亲那边的 X 染色体祖源。这些都只是趋势或统计，不能预测个人。", "The 'polygenic scores' (sums of hundreds of thousands of tiny effects); sites for personality, memory, athletics, longevity, sleep, salt sensitivity; variants rare in East Asians; chromosome-by-chromosome north/south leaning; the maternal X chromosome. All are tendencies or statistics, not predictions about you."], "c_y": ["父系：Y 染色体属于 O-F438 支（旧命名 O2a2b1a1a1）", "Father's line: Y chromosome in branch O-F438 (older name O2a2b1a1a1)"], "n_y": ["Y 染色体只从父亲传给儿子，所以它记录的是你的父系一条线。O-F438 是 O-M117 下面的一支，在汉族尤其北方汉族里很常见，YFull 数据库估计这一支大约形成于 {formed} 年前。芯片在这条支上最末一级只测了 1 个位点，再往下分不了。它说明不了你的籍贯或民族，只说明父系属于一个很大的东亚人群。", "The Y chromosome passes only from father to son, so it records one paternal line. O-F438 sits under O-M117 and is common among Han Chinese, especially in the north; the YFull database dates the branch to roughly {formed} years ago. The array has only one site at the last step, so nothing finer can be resolved. It says nothing about hometown or ethnicity, only that the paternal line belongs to a large East Asian group."], "c_mt": ["母系：线粒体属于 D4h1 支（芯片测到 {mts} 个线粒体位点，可信度 {mtq}）", "Mother's line: mitochondria in branch D4h1 ({mts} mitochondrial sites tested, confidence {mtq})"], "n_mt": ["线粒体只从母亲传下来，记录的是母系一条线。D4 是东亚最常见的母系支系之一。芯片只测了线粒体约 {mtcov}% 的位置，36 个和参考序列不同的位点里 {nf} 个正好落在 D4h1 这条支的定义上，另外 {npv} 个是你自己的私有变异。这不是完整的线粒体测序，D4h1 再往下分不了。", "Mitochondria pass only from the mother, so this is one maternal line. D4 is among the commonest maternal branches in East Asia. The array covers about {mtcov}% of the mitochondrial genome; of 36 differences from the reference, {nf} fall exactly on the D4h1 branch and {npv} are private to you. This is not full mitochondrial sequencing; nothing below D4h1 can be resolved."], "c_pca": ["和全世界 2,504 个人放在一起看：你落在东亚人群里", "Placed among 2,504 people from around the world: you fall inside the East Asian group"], "c_hgdp": ["在 HGDP 项目的 18 个东亚人群里，离你最近的是北方汉族样本；这只是在现有样本里的相对位置，不是籍贯", "Among 18 East Asian groups in the HGDP panel, the nearest is the Northern Han sample; a position among available samples, not a hometown"], "c_tr": ["直接测出来的位点，每条标了可信度等级", "Directly measured sites, each with a confidence grade"], "c_pgx": ["用药相关：只说测到或没测到什么，不下芯片支撑不了的结论", "Medicines: only what was found or not found, no conclusions the array cannot support"], "c_cv": ["和 ClinVar 疾病变异库（{cvd} 版）比对：{n} 个位点有记录，绝大多数是“良性”，没有确认的致病变异", "Checked against the ClinVar disease-variant database ({cvd}): {n} sites have entries, almost all 'benign', no confirmed disease-causing variant"], "n_cv": ["这里回答的问题是“芯片测到的位点里，有没有和已知疾病变异重合的”，不是“我有没有遗传病”。两条标为“致病”的记录（疟疾易感、CDKN2B）都是没有评审依据的旧条目，属于“易感性”而不是疾病。芯片没测的罕见变异无法排除。", "The question answered here is 'do any tested sites match known disease variants', not 'do I have a genetic disease'. The two entries labelled 'pathogenic' (malaria susceptibility, CDKN2B) are old, unreviewed 'susceptibility' notes, not diseases. Rare variants the array does not test cannot be excluded."], "c_roh": ["近亲检查：{n} 段较长的纯合区，最长 {mx} Mb，没有特别长的；没有父母近亲的迹象", "Relatedness check: {n} longer homozygous stretches, longest {mx} Mb, none very long; no sign of parental relatedness"], "c_ns": ["逐条染色体看南北倾向（0 = 南方汉族中心，1 = 北京汉族中心）", "North/south leaning chromosome by chromosome (0 = southern Han centre, 1 = Beijing Han centre)"], "n_ns": ["整体坐标 {idx}，落在北京汉族样本的分布范围之内（偏离其中心 {sd:+} 个标准差）。它不是“百分之多少北方”，只是在一条坐标轴上的位置。单条染色体位点少，数值抖动大，看个热闹就好。", "Overall coordinate {idx}, inside the spread of the Beijing Han samples ({sd:+} standard deviations from their centre). It is not 'x% northern', just a position on one axis. Single chromosomes have few sites and jump around; enjoy, but do not over-read."], "c_x": ["母亲那边的 X 染色体：也是东亚人，再细分不了", "The X chromosome from your mother: also East Asian, cannot be split finer"], "n_x": ["男性的 X 染色体全部来自母亲。用 4,044 个位点只够回答“哪个大洲”，北京汉、南方汉、日本人分不开。", "A man's X comes entirely from his mother. With 4,044 sites it can only answer 'which continent'; Beijing Han, southern Han and Japanese cannot be told apart."], "c_rare": ["在 504 个东亚人里少见的变异：{n} 个，其中 {abs} 个在这 504 人里一次都没出现", "Variants rare among 504 East Asians: {n}, of which {abs} never appeared in those 504 people"], "n_rare": ["“没在 504 人里出现”不等于“东亚人没有”，只是样本小。这些变异大多在世界其他地方并不少见，也可能有个别是芯片测错。它们没有已知的健康含义。", "'Not seen in 504 people' does not mean 'absent in East Asians'; the sample is small. Most are not rare elsewhere in the world, and a few may be array errors. None has a known health meaning."], "c_fun": ["趣味位点：性格、记忆、运动、长寿、睡眠。有研究提过，但看不出个人差别", "Fun sites: personality, memory, athletics, longevity, sleep. Mentioned in studies, but no visible effect on an individual"], "c_prs": ["多基因评分：把几十万个小效应位点加在一起，看你在 504 个东亚人里排第几", "Polygenic scores: hundreds of thousands of tiny effects added up, then ranked among 504 East Asians"], "n_prs": ["芯片只直接测了这些评分需要的约三分之一的位点，所以先用“基因型填补”把没测的位点根据人群规律推算出来（输入 {inp} 个位点，推算后按人群频率保留 {hq} 个变异），再打分。自检：故意遮住一部分测过的位点再推算，推对 {conc}%。百分位是“在 1000 Genomes 项目的 504 个东亚人里排第几”，不是在所有中国人里排第几；这 504 人是测序数据，你是推算数据，所以仍是近似。评分覆盖率 {c1}–{c2}%。<b>90 以上或 10 以下才值得留意，而且只是人群趋势，不是诊断。</b>", "The array directly measures only about a third of the sites these scores need, so missing sites were first 'imputed' (inferred from population patterns; {inp} input sites, {hq} variants kept by population frequency), then scored. Self-check: deliberately hiding some measured sites and re-inferring them was {conc}% correct. Percentiles mean 'rank among the 504 East Asians in the 1000 Genomes project', not among all Chinese; those 504 are sequenced while you are imputed, so it remains approximate. Score coverage {c1}–{c2}%. <b>Only values above 90 or below 10 deserve attention, and even then they are population tendencies, not diagnoses.</b>"], "c_prs_old": ["附录：第一版只用直接测到的位点算的分，误差有多大", "Appendix: the first version's scores from directly measured sites only, and how wrong they can be"], "n_prs_old": ["为了知道“只用三分之一位点”会错多少，我们让 504 个东亚人各算两次：完整评分和芯片子集评分。结果排名相关 {r1}–{r2}，一半人的百分位偏差在 {dm} 以内，但十分之一的人偏差超过 {d90}（最坏 {d90m}）。图中横线就是每个评分的这种误差范围。所以第一版里“糖尿病 91”“胃癌 0.4”这类结论不能采信。", "To see how wrong 'one third of the sites' can be, each of the 504 East Asians was scored twice: with the full score and with the array subset. Rank correlation was {r1}–{r2}; half the people were within {dm} percentile points, but one in ten was off by more than {d90} (worst {d90m}). The whiskers show that error range per score. This is why first-version claims such as 'diabetes 91' or 'stomach cancer 0.4' cannot be trusted."], "sub_y": ["从 O 到 O-F438 逐级下行 · 圆越大支持位点越多 · 名称按 ISOGG 2016，与 YFull 9.05 核对", "descending from O to O-F438 · bigger circle = more supporting sites · ISOGG 2016 names, checked against YFull 9.05"], "sub_pg": ["1000 Genomes 项目 2,504 人 · {n} 个位点 · 一点 = 一个人 · 大宇被投影进参考空间", "1000 Genomes, 2,504 people · {n} sites · one dot = one person · the sample projected into the reference space"]};

/* ── scatter helper ── */
function scatter(s,c,pts,me,opts){
  const {x0=44,y0=14,W=360,H=290,xl='PC1',yl='PC2',color,labels}=opts;
  const xs=pts.map(p=>p.x).concat(me.x), ys=pts.map(p=>p.y).concat(me.y);
  let xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);
  const dx=(xmax-xmin)*.06,dy=(ymax-ymin)*.06; xmin-=dx;xmax+=dx;ymin-=dy;ymax+=dy;
  const X=v=>x0+W*(v-xmin)/(xmax-xmin), Y=v=>y0+H*(1-(v-ymin)/(ymax-ymin));
  el(s,'rect',{x:x0,y:y0,width:W,height:H,fill:'none',stroke:c.grid,'stroke-width':.6});
  txt(s,{x:x0+W/2,y:y0+H+22,'text-anchor':'middle','font-size':8,'font-weight':700,fill:c.muted,'letter-spacing':'.1em'},xl);
  txt(s,{x:x0-30,y:y0+H/2,'text-anchor':'middle','font-size':8,'font-weight':700,fill:c.muted,'letter-spacing':'.1em',transform:`rotate(-90 ${x0-30} ${y0+H/2})`},yl);
  pts.forEach(p=>{const d=el(s,'circle',{cx:X(p.x).toFixed(1),cy:Y(p.y).toFixed(1),r:2.1,fill:color(p),opacity:.85});tip(d,p.t)});
  if(labels){const groups={};pts.forEach(p=>{(groups[p.g]=groups[p.g]||[]).push(p)});
    Object.entries(groups).forEach(([g,arr])=>{const mx=arr.reduce((a,p)=>a+p.x,0)/arr.length,my=arr.reduce((a,p)=>a+p.y,0)/arr.length;
      txt(s,{x:X(mx),y:Y(my)-6,'text-anchor':'middle','font-size':7.5,'font-weight':700,fill:c.ink,stroke:c.bg,'stroke-width':2.5,'paint-order':'stroke','letter-spacing':'.06em'},g.toUpperCase())})}
  const mx=X(me.x),my=Y(me.y);
  el(s,'rect',{x:mx-5.5,y:my-5.5,width:11,height:11,fill:c.hero,stroke:c.bg,'stroke-width':1.5,transform:`rotate(45 ${mx} ${my})`,class:'pop'});
  txt(s,{x:mx+9,y:my+3,'font-size':9,'font-weight':800,fill:c.ink,stroke:c.bg,'stroke-width':3,'paint-order':'stroke'},D.name[1]);
  if(opts.foot) foot(s,c,420,336,opts.foot);
}

  const my=top+rows.length*rh+6; el(s,'rect',{x:X(mean)-5,y:my-5,width:10,height:10,fill:c.hero,transform:`rotate(45 ${X(mean)} ${my})`});
  txt(s,{x:X(mean)+10,y:my+3,'font-size':8.5,'font-weight':800,fill:c.ink},(zh()?'全基因组均值 ':'genome mean ')+mean.toFixed(2));
  foot(s,c,900,352,zh()?'空心 = 偏南方 · 实心 = 偏北方 · 菱形 = 全基因组均值':'hollow = leans south · filled = leans north · diamond = genome mean');
});

    yv:D.y_meta.yfull_version, formed:fmt(D.y_meta.formed_years), yconf:Object.entries(D.y_conflicts).filter(([k,v])=>v.anc>0).map(([k,v])=>k+' '+v.anc+'/'+(v.anc+v.der)).join(', ')||'0',
    mts:fmt(D.mt.sites), mtq:D.mt.quality, mtcov:D.mt.coverage_pct, nf:D.mt.n_found, npv:D.mt.n_private,

    removed:D.traits_removed.join(', '), inp:fmt(D.impute_input_sites), hq:fmt(D.imputed_variants_hq), conc:(ic.conc_all*100).toFixed(1), hconc:(ic.het_conc_all*100).toFixed(1),
    c1:pi.cov_min, c2:pi.cov_max, w1:pi.w_min, w2:pi.w_max, r1:pv.rho_min.toFixed(2), r2:pv.rho_max.toFixed(2), dm:pv.dev_median_median.toFixed(1), d90:pv.dev_p90_median.toFixed(1), d90m:pv.dev_p90_max.toFixed(1),
    cvd:D.clinvar_date, idx:ns.index, sd:ns.sd_from_chb, mx:D.roh_stats.max_mb, nrs:fmt(k.n_rsid), nw:fmt(k.n_wid), ind:fmt(k.indels), abs:D.rare_absent});
  // section-specific overrides
  F.n_cv = D.clinvar_total;
}
function renderKpi(){const k=D.kpi; document.getElementById('kpi_sites').textContent=fmt(k.sites); document.getElementById('kpi_het').innerHTML=(k.het_auto*100).toFixed(1)+'<small>%</small>'; document.getElementById('kpi_x').textContent='XY';}
// per-key placeholder overrides (some keys reuse {n})
const _t = t; const NKEY = {c_cv:()=>D.clinvar_total, n_cv:()=>D.clinvar_total, src_pg:()=>fmt(D.n_pruned_global), src_pe:()=>fmt(D.n_pruned_eas), src_h12:()=>fmt(D.n_pruned_hgdp), sub_pg:()=>fmt(D.n_pruned_global), sub_pe:()=>fmt(D.n_pruned_eas), sub_h12:()=>fmt(D.n_pruned_hgdp), c_roh:()=>D.roh_stats.n, c_rare:()=>D.rare_n, n_prs_old:()=>null};
const NEAR = {src_pe:()=>D.near_eas[0][0], src_pg:()=>D.near_global[0][0]}; const KNN = {src_hd:()=>Object.entries(D.knn_hgdp).map(([p,n])=>p+' '+n).join(' · ')};
const CV = {n_prs_old:[D.prs_validation_summary.cov_min, D.prs_validation_summary.cov_max]};
function tt(k){ const saveN=F.n, saveNear=F.near, saveK=F.knn, c1=F.c1, c2=F.c2; if(NKEY[k]&&NKEY[k]()!==null) F.n=NKEY[k](); if(NEAR[k]) F.near=NEAR[k](); if(KNN[k]) F.knn=KNN[k](); if(CV[k]){F.c1=CV[k][0];F.c2=CV[k][1]}
  const s=_t(k); F.n=saveN; F.near=saveNear; F.knn=saveK; F.c1=c1; F.c2=c2; return s; }

/* ── trait tables ── */
const trName=r=>zh()?r.phenotype:(TRAIT_EN[r.rsid]||[r.phenotype])[0];
const trRead=r=>{const p=PLAIN[r.rsid]; if(p) return zh()?p[0]:p[1]; return zh()?(D.traits_zh_orig[r.rsid]||''):((TRAIT_EN[r.rsid]||[])[1]||'')};
const lvlTxt=l=>zh()?(LEVEL_ZH[l]||l):(LEVEL_EN[l]||l);
function traitTable(rows){
  let h=`<div class="tablewrap"><table><thead><tr><th style="width:24%">${tt('th_trait')}</th><th style="width:10%">${tt('th_gene')}</th><th style="width:10%">${tt('th_gt')}</th><th style="width:9%">${tt('th_lvl')}</th><th>${tt('th_int')}</th></tr></thead><tbody>`;
  rows.forEach(r=>{const lv=(r.evidence_level||'').charAt(0);
    h+=`<tr><td>${trName(r)}<div style="color:var(--faint);font-size:9.5px">${r.rsid}</div></td><td class="gene">${r.gene}</td><td class="g">${r.genotype||'—'}</td><td><span class="lvl ${lv}">${lv||'—'}</span><span class="src-tag">${(r.direct_or_proxy||'').replace(/_/g,' ')}</span></td><td>${trRead(r)}</td></tr>`});
  return h+'</tbody></table></div>';
}
const EXPL = new Set(D.traits_v2.filter(r=>(r.evidence_level||'').startsWith('D')).map(r=>r.rsid));
function renderTraits(){
  const order=['代谢','外貌','感官','运动','神经','血型','疾病风险','免疫','心血管','行为','长寿','睡眠'];
  const T=D.traits_v2.filter(r=>r.category!=='药物'&&!EXPL.has(r.rsid)); const by={}; T.forEach(r=>{(by[r.category]=by[r.category]||[]).push(r)});
  let h=''; order.filter(k=>by[k]).forEach(k=>{h+=`<div class="cat">${zh()?k:(CAT_EN[k]||k)}</div>`+traitTable(by[k])});
  h+=`<p class="note" style="margin-top:12px">${tt('n_tr')}</p>`; document.getElementById('traits').innerHTML=h;
}
function renderFun(){ document.getElementById('fun').innerHTML=traitTable(D.traits_v2.filter(r=>EXPL.has(r.rsid))); }
function renderPgx(){
  let h=`<div class="tablewrap"><table><thead><tr><th style="width:11%">${tt('th_gene')}</th><th style="width:16%">${tt('th_var')}</th><th style="width:10%">${tt('th_gt')}</th><th style="width:13%">${tt('th_cov')}</th><th style="width:12%">${tt('th_ph')}</th><th>${tt('th_read')}</th></tr></thead><tbody>`;
  D.pgx_v2.forEach(r=>{h+=`<tr><td class="gene">${r.gene}<span class="src-tag">${r.direct_or_tag}</span></td><td class="rs">${r.variants}</td><td class="g" style="font-size:12px">${r.genotype}</td><td style="color:var(--muted)">${(PGX_COV[r.gene]||[r.star_allele_coverage,r.star_allele_coverage])[zh()?0:1]}</td><td>${/NOT|not|REQUIRES/.test(r.phenotype_assignable)?(zh()?'不能':'no'):(zh()?'能':'yes')}</td><td>${(PGX_PLAIN[r.gene]||[r.effect_alleles_carried||'',r.effect_alleles_carried||''])[zh()?0:1]}</td></tr>`});
  document.getElementById('pgx').innerHTML=h+'</tbody></table></div>';
}
function renderRare(){
  let h=`<div class="tablewrap"><table><thead><tr><th>rsID</th><th>${tt('th_pos')}</th><th>${tt('th_al')}</th><th>${tt('th_gt')}</th><th>${tt('th_feas')}</th><th>${tt('th_fall')}</th><th>${tt('th_gene')}</th></tr></thead><tbody>`;
  D.rare.slice(0,10).forEach(r=>{h+=`<tr><td class="rs">${r.rsid}</td><td class="num">chr${r.chrom}:${fmt(r.pos)}</td><td class="g">${r.allele}</td><td class="g">${r.geno.replace('/','')}</td><td class="num">${(r.freq_eas*100).toFixed(1)}%</td><td class="num">${(r.freq_all*100).toFixed(1)}%</td><td class="gene">${r.gene||'—'}</td></tr>`});
  document.getElementById('rare').innerHTML=h+'</tbody></table></div>';
}

/* ── PRS rows (imputed) and old subset rows with measured whiskers ── */
function prsRowsV2(s,c,data,opts){
  const rows=[...data].sort((a,b)=>b.pct_EAS-a.pct_EAS); const x0=250,x1=800,top=30,rh=26.5,W=x1-x0,X=v=>x0+W*Math.max(0,Math.min(100,v))/100;
  el(s,'rect',{x:X(25),y:top-14,width:X(75)-X(25),height:rows.length*rh+8,fill:c.fd,opacity:.35});
  el(s,'line',{x1:X(50),y1:top-14,x2:X(50),y2:top+rows.length*rh-6,stroke:c.faint,'stroke-width':.8,'stroke-dasharray':'2 3'});
  [0,25,50,75,100].forEach(v=>txt(s,{x:X(v),y:top-20,'text-anchor':'middle','font-size':7.5,'font-weight':600,fill:c.faint},v+'%'));
  txt(s,{x:x1+8,y:top-20,'font-size':7,'font-weight':600,fill:c.faint,'letter-spacing':'.08em'},D.pop.subpops.join('+'));
  foot(s,c,900,top+rows.length*rh+14,opts.foot);
  rows.forEach((r,i)=>{const y=top+i*rh,p=r.pct_EAS;
    txt(s,{x:x0-12,y:y+3.5,'text-anchor':'end','font-size':10,'font-weight':600,fill:c.ink},zh()?r.trait:(PRS_EN[r.trait]||r.trait));
    txt(s,{x:x0-12,y:y+14,'text-anchor':'end','font-size':7,fill:c.faint},opts.sub(r));
    el(s,'line',{x1:x0,y1:y,x2:x1,y2:y,stroke:c.grid,'stroke-width':.6});
    if(opts.whisker){const w=opts.whisker(r); el(s,'line',{x1:X(p-w),y1:y,x2:X(p+w),y2:y,stroke:c.data2,'stroke-width':1.4}); [p-w,p+w].forEach(v=>el(s,'line',{x1:X(v),y1:y-4,x2:X(v),y2:y+4,stroke:c.data2,'stroke-width':1.2}));}
    if(r.pct_Han!==undefined){el(s,'circle',{cx:X(r.pct_Han),cy:y,r:2.6,fill:c.bg,stroke:c.data2,'stroke-width':1.2});}
    const d=el(s,'circle',{cx:X(p),cy:y,r:5,fill:c.data,stroke:c.bg,'stroke-width':1.5,class:'pop'}); d.style.animationDelay=(i*12)+'ms'; tip(d,`${r.trait} · EAS ${p}% · z=${r.z_vs_EAS}`);
    txt(s,{x:X(p)+(p>88?-10:10),y:y+3.5,'text-anchor':p>88?'end':'start','font-size':9,'font-weight':800,fill:c.ink,...NUM},p.toFixed(0)+'%');
    if(r.pct_Han!==undefined) txt(s,{x:x1+8,y:y+3.5,'font-size':8,'font-weight':600,fill:c.muted,...NUM},r.pct_Han.toFixed(0)+'%');
  });
}
reveal('prsimp',(s,c)=>prsRowsV2(s,c,D.prs_imputed,{foot:zh()?'实心 = 在参考人群 '+D.pop.superpop+' 中的百分位 · 空心 = '+D.pop.subpops.join('+')+' · 灰带 = 中间一半':'filled = percentile within '+D.pop.superpop+' · hollow = '+D.pop.subpops.join('+')+' · band = middle half',sub:r=>`${r.pgs} · ${r.coverage_of_score_pct}% / ${r.weight_retained_pct}% · GP≥0.9: ${r.gp90_pct_EAS}%`}));

  prsRowsV2(s,c,rows,{foot:zh()?'横线 = 实测误差范围（十分之一的人会超出）· 第一版只用直接测到的位点':'whisker = measured error (exceeded by one in ten) · first version, typed sites only',sub:r=>`${r.pgs} · ${r.coverage_pct}% · ρ=${(pv[r.pgs]||{}).spearman_full_vs_subset??'—'}`, whisker:r=>(pv[r.pgs]||{}).pct_dev_p90||0})});

fillVars(); renderAll();
